              <div class="flex flex-wrap gap-2.5 pt-1">
                <button onclick="downloadJSONBackup()" class="px-4 py-2.5 rounded-2xl bg-[#006A4E] hover:bg-emerald-700 text-white text-xs font-extrabold">
                  <i class="fa-solid fa-download mr-1"></i> ${t('backupJSON')}
                </button>
                <label class="cursor-pointer px-4 py-2.5 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-xs font-extrabold">
                  <i class="fa-solid fa-upload mr-1"></i> ${t('restoreJSON')}
                  <input type="file" accept=".json" onchange="restoreJSONBackup(event)" class="hidden" />
                </label>
              </div>
              <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex flex-wrap gap-2.5">
                <button onclick="openConfirmModal('resetDemo')" class="px-4 py-2.5 rounded-2xl bg-rose-50 dark:bg-rose-950/60 text-[#F42A41] border border-rose-200 dark:border-rose-800 text-xs font-extrabold">
                  <i class="fa-solid fa-trash-can mr-1"></i> ${t('clearDemoBtn')}
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
        }

        function handleSaveProfile(e) {
            e.preventDefault();
            appState.settings.userName = document.getElementById('set-username').value.trim() || 'Student';
            appState.settings.userTagline = document.getElementById('set-tagline').value.trim() || 'Personal Finance • ৳ BDT';
            saveState();
            updateStaticTranslations();
            showToast('Profile settings saved!', 'success');
        }

        function handleAddCustomCategory(e) {
            e.preventDefault();
            const en = document.getElementById('cust-cat-en').value.trim();
            const bn = document.getElementById('cust-cat-bn').value.trim();
            const id = 'custom_' + Date.now();
            appState.customExpenseCategories.push({
                id,
                en,
                bn,
                icon: 'fa-star',
                color: '#8B5CF6',
                bg: 'bg-purple-100 text-purple-700 dark:bg-purple-950/60 dark:text-purple-300',
            });
            saveState();
            renderCurrentView();
            showToast('Custom category added!', 'success');
        }

        function removeCustomCategory(id) {
            appState.customExpenseCategories = appState.customExpenseCategories.filter((c) => c.id !== id);
            saveState();
            renderCurrentView();
        }

        function downloadJSONBackup() {
            const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(appState, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute('href', dataStr);
            dlAnchor.setAttribute('download', `HisabKhata_Backup_${toISODate(new Date())}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast('JSON backup downloaded!', 'success');
        }

        function restoreJSONBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && Array.isArray(imported.transactions)) {
                        const fresh = getDefaultFreshState();
                        appState = {
                            ...fresh,
                            ...imported,
                            settings: { ...fresh.settings, ...(imported.settings || {}) },
                            budgets: { ...fresh.budgets, ...(imported.budgets || {}) },
                        };
                        saveState();
                        applyTheme();
                        updateStaticTranslations();
                        renderNavigation();
                        renderCurrentView();
                        showToast('Backup restored successfully!', 'success');
                    } else {
                        showToast('Invalid HisabKhatā backup file.', 'error');
                    }
                } catch (err) {
                    showToast('Failed to parse backup JSON.', 'error');
                }
            };
            reader.readAsText(file);
        }

        // =========================================================================
        // 8. INITIALIZATION ON WINDOW LOAD
        // =========================================================================
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            applyTheme();
            updateStaticTranslations();
            renderNavigation();
            renderCurrentView();
        });
    </script>
</body>

</html>
