<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HisabKhatā (হিসাবখাতা) — Student Personal Finance Manager</title>

    <!-- Google Fonts: Inter & Noto Sans Bengali -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans Bengali', 'sans-serif'],
                        bengali: ['Noto Sans Bengali', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        bdgreen: {
                            DEFAULT: '#006A4E',
                            light: '#10B981',
                            dark: '#004D38',
                            soft: '#ECFDF5',
                        },
                        bdred: {
                            DEFAULT: '#F42A41',
                            light: '#EF4444',
                            dark: '#C81E32',
                            soft: '#FEF2F2',
                        },
                    },
                    boxShadow: {
                        'soft': '0 10px 30px -10px rgba(0, 106, 78, 0.08)',
                        'glow-green': '0 8px 24px -4px rgba(16, 185, 129, 0.35)',
                        'glow-red': '0 8px 24px -4px rgba(244, 42, 65, 0.35)',
                    }
                },
            },
        };
    </script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        /* Custom Scrollbar & Smooth Transitions */
        * {
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        body {
            font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.6);
        }

        /* Glassmorphism & Card Micro-interactions */
        .glass-card {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .hover-lift {
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease;
        }

        .hover-lift:hover {
            transform: translateY(-3px);
        }

        /* Sidebar width helpers (Tailwind has no w-68 by default) */
        .w-68 {
            width: 17rem;
        }

        /* Animated Gradient Hero Banner */
        .bd-gradient-banner {
            background: linear-gradient(135deg, #006A4E 0%, #059669 55%, #0D9488 100%);
            position: relative;
            overflow: hidden;
        }

        .bd-gradient-banner::after {
            content: '';
            position: absolute;
            right: -30px;
            top: -30px;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244, 42, 65, 0.85) 0%, rgba(244, 42, 65, 0.25) 70%, transparent 100%);
            pointer-events: none;
        }

        /* Print Styling for Reports */
        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background: #fff !important;
                color: #000 !important;
            }

            #main-scroll-area {
                overflow: visible !important;
                height: auto !important;
            }
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
    </div>

    <!-- Main App Wrapper -->
    <div class="flex flex-1 min-h-screen">

        <!-- Desktop Sidebar (Collapsible) -->
        <aside id="desktop-sidebar"
            class="no-print hidden lg:flex flex-col w-68 bg-white dark:bg-slate-900 border-r border-slate-200/80 dark:border-slate-800 transition-all duration-300 shrink-0 sticky top-0 h-screen z-30">
            <!-- Brand Header -->
            <div class="p-5 flex items-center justify-between border-b border-slate-100 dark:border-slate-800">
                <div class="flex items-center gap-3">
                    <div
                        class="w-11 h-11 rounded-2xl bg-gradient-to-br from-[#006A4E] to-emerald-500 flex items-center justify-center text-white shadow-glow-green relative">
                        <span class="font-extrabold text-xl">৳</span>
                        <span
                            class="w-3 h-3 rounded-full bg-[#F42A41] border-2 border-white dark:border-slate-900 absolute -top-1 -right-1"></span>
                    </div>
                    <div class="sidebar-label">
                        <h1 class="font-extrabold text-lg tracking-tight leading-none text-slate-900 dark:text-white">
                            HisabKhatā
                        </h1>
                        <p class="text-xs font-semibold text-[#006A4E] dark:text-emerald-400 mt-0.5">হিসাবখাতা • Student
                        </p>
                    </div>
                </div>
                <button onclick="toggleSidebar()"
                    class="p-2 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800"
                    title="Collapse Sidebar">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
            </div>

            <!-- Student Mini Card -->
            <div class="p-4 sidebar-label">
                <div
                    class="p-3.5 rounded-2xl bg-gradient-to-r from-emerald-500/10 via-teal-500/10 to-rose-500/10 border border-emerald-500/20 flex items-center gap-3">
                    <div id="sidebar-avatar"
                        class="w-10 h-10 rounded-full bg-gradient-to-tr from-[#006A4E] to-teal-400 text-white font-bold flex items-center justify-center text-sm shrink-0">
                        AR
                    </div>
                    <div class="min-w-0">
                        <p id="sidebar-user-name" class="text-sm font-bold truncate">Student User</p>
                        <p id="sidebar-user-tag" class="text-[11px] text-slate-500 dark:text-slate-400 truncate">
                            Personal Finance • ৳ BDT</p>
                    </div>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav id="desktop-nav" class="flex-1 overflow-y-auto px-3 py-2 space-y-1">
                <!-- Populated dynamically by JS -->
            </nav>

            <!-- Sidebar Footer Local Storage Status Pill -->
            <div class="p-4 border-t border-slate-100 dark:border-slate-800 sidebar-label">
                <div
                    class="p-3 rounded-2xl bg-emerald-50/80 dark:bg-emerald-950/40 border border-emerald-200/80 dark:border-emerald-800/60 text-xs">
                    <div class="flex items-center justify-between font-bold text-[#006A4E] dark:text-emerald-300 mb-1">
                        <span><i class="fa-solid fa-database mr-1"></i> <span data-i18n="storageLabel">Local
                                Storage</span></span>
                        <span class="px-1.5 py-0.5 rounded-md bg-emerald-200/70 dark:bg-emerald-800 text-[10px]">BDT
                            ৳</span>
                    </div>
                    <p class="text-[11px] text-emerald-800/80 dark:text-emerald-400/80 mb-2" data-i18n="storageHint">
                        Saved privately in this browser.</p>
                    <div class="flex gap-1.5">
                        <button onclick="downloadJSONBackup()"
                            class="flex-1 py-1.5 px-2 rounded-lg bg-[#006A4E] text-white font-semibold hover:bg-emerald-700 text-[11px]"
                            data-i18n="backupShortBtn">Backup</button>
                        <button onclick="openConfirmModal('resetDemo')"
                            class="flex-1 py-1.5 px-2 rounded-lg bg-white dark:bg-slate-800 text-rose-600 dark:text-rose-400 font-semibold border border-rose-200 dark:border-rose-800 hover:bg-rose-50 text-[11px]"
                            data-i18n="resetBtn">Reset</button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Column -->
        <div class="flex-1 flex flex-col min-w-0 pb-20 lg:pb-6">

            <!-- Sticky Top Bar -->
            <header
                class="no-print sticky top-0 z-20 bg-white/85 dark:bg-slate-900/85 glass-card border-b border-slate-200/80 dark:border-slate-800 px-4 sm:px-6 py-3">
                <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
                    <!-- Mobile Logo + Page Title -->
                    <div class="flex items-center gap-3 min-w-0">
                        <div
                            class="lg:hidden w-9 h-9 rounded-xl bg-gradient-to-br from-[#006A4E] to-emerald-500 flex items-center justify-center text-white font-extrabold shadow-sm relative shrink-0">
                            ৳
                            <span
                                class="w-2.5 h-2.5 rounded-full bg-[#F42A41] border border-white absolute -top-0.5 -right-0.5"></span>
                        </div>
                        <div class="min-w-0">
                            <div class="flex items-center gap-2">
                                <h2 id="page-title"
                                    class="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white truncate">
                                    Dashboard</h2>
                                <span
                                    class="hidden sm:inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-50 text-[#006A4E] dark:bg-emerald-950/70 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                    <span data-i18n="freshBadge">Fresh Local Storage</span>
                                </span>
                            </div>
                            <p id="header-date-display"
                                class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block"></p>
                        </div>
                    </div>

                    <!-- Top Bar Controls -->
                    <div class="flex items-center gap-2 sm:gap-2.5 shrink-0">
                        <!-- Quick Add Expense Button -->
                        <button onclick="openTransactionModal('expense')"
                            class="hidden sm:inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-[#F42A41] hover:bg-rose-600 text-white text-xs font-bold shadow-glow-red active:scale-95 transition">
                            <i class="fa-solid fa-minus-circle"></i>
                            <span data-i18n="addExpenseShort">+ Expense</span>
                        </button>

                        <!-- Quick Add Income Button -->
                        <button onclick="openTransactionModal('income')"
                            class="hidden sm:inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-[#006A4E] hover:bg-emerald-700 text-white text-xs font-bold shadow-glow-green active:scale-95 transition">
                            <i class="fa-solid fa-plus-circle"></i>
                            <span data-i18n="addIncomeShort">+ Income</span>
                        </button>

                        <!-- Bangla Digits Toggle -->
                        <button id="digit-toggle-btn" onclick="toggleBanglaDigits()"
                            class="px-2.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100/80 dark:bg-slate-800 hover:bg-slate-200/70 dark:hover:bg-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200"
                            title="Switch English / Bangla Digits">
                            ১২৩ / 123
                        </button>

                        <!-- Language Instant Switch (EN / বাংলা) -->
                        <button id="lang-toggle-btn" onclick="toggleLanguage()"
                            class="px-3 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white text-xs font-extrabold shadow-sm flex items-center gap-1.5 active:scale-95 transition">
                            <i class="fa-solid fa-language text-sm"></i>
                            <span id="lang-toggle-label">বাংলা</span>
                        </button>

                        <!-- Notifications Bell -->
                        <button onclick="navigateTo('notifications')"
                            class="relative p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300">
                            <i class="fa-solid fa-bell"></i>
                            <span id="notif-badge-count"
                                class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-[#F42A41] text-white text-[10px] font-bold flex items-center justify-center">3</span>
                        </button>

                        <!-- Theme Toggle -->
                        <button onclick="toggleTheme()"
                            class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-600 dark:text-amber-400"
                            title="Toggle Dark/Light Theme">
                            <i id="theme-icon" class="fa-solid fa-moon"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Main Dynamic View Container -->
            <main id="main-scroll-area" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-5">
                <!-- Active Section View Injected Here -->
                <div id="view-container" class="space-y-6"></div>
            </main>
        </div>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav
        class="no-print lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 dark:bg-slate-900/95 glass-card border-t border-slate-200 dark:border-slate-800 px-2 py-1.5 flex items-center justify-around">
        <button onclick="navigateTo('dashboard')" data-mobile-nav="dashboard"
            class="mobile-nav-btn flex flex-col items-center py-1 px-2 rounded-xl text-[#006A4E] dark:text-emerald-400">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] font-bold mt-0.5" data-i18n="navDashboard">Home</span>
        </button>
        <button onclick="navigateTo('transactions')" data-mobile-nav="transactions"
            class="mobile-nav-btn flex flex-col items-center py-1 px-2 rounded-xl text-slate-500 dark:text-slate-400">
            <i class="fa-solid fa-receipt text-base"></i>
            <span class="text-[10px] font-bold mt-0.5" data-i18n="navTransactions">History</span>
        </button>
        <!-- Center Floating Add Button -->
        <button onclick="openTransactionModal('expense')"
            class="w-12 h-12 -mt-5 rounded-2xl bg-gradient-to-tr from-[#006A4E] via-emerald-500 to-[#F42A41] text-white shadow-lg flex items-center justify-center text-xl active:scale-90 transition">
            <i class="fa-solid fa-plus"></i>
        </button>
        <button onclick="navigateTo('budgets')" data-mobile-nav="budgets"
            class="mobile-nav-btn flex flex-col items-center py-1 px-2 rounded-xl text-slate-500 dark:text-slate-400">
            <i class="fa-solid fa-chart-pie text-base"></i>
            <span class="text-[10px] font-bold mt-0.5" data-i18n="navBudgets">Budgets</span>
        </button>
        <button onclick="toggleMobileDrawer()"
            class="mobile-nav-btn flex flex-col items-center py-1 px-2 rounded-xl text-slate-500 dark:text-slate-400">
            <i class="fa-solid fa-border-all text-base"></i>
            <span class="text-[10px] font-bold mt-0.5" data-i18n="navMore">More</span>
        </button>
    </nav>

    <!-- Mobile "More" Drawer -->
    <div id="mobile-drawer" class="fixed inset-0 z-50 hidden">
        <div onclick="toggleMobileDrawer()" class="absolute inset-0 bg-slate-950/60 backdrop-blur-xs"></div>
        <div
            class="absolute bottom-0 inset-x-0 bg-white dark:bg-slate-900 rounded-t-3xl p-5 max-h-[82vh] overflow-y-auto border-t border-slate-200 dark:border-slate-800 shadow-2xl">
            <div class="w-12 h-1.5 rounded-full bg-slate-300 dark:bg-slate-700 mx-auto mb-4"></div>
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-extrabold text-base" data-i18n="allModules">All HisabKhatā Modules</h3>
                <button onclick="toggleMobileDrawer()"
                    class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="mobile-drawer-grid" class="grid grid-cols-3 gap-2.5 mb-4">
                <!-- Populated by JS -->
            </div>
            <div class="pt-3 border-t border-slate-200 dark:border-slate-800 flex gap-2">
                <button onclick="toggleMobileDrawer(); downloadJSONBackup()"
                    class="flex-1 py-2.5 rounded-xl bg-[#006A4E] text-white text-xs font-bold"
                    data-i18n="backupJSON">Download JSON Backup</button>
                <button onclick="toggleMobileDrawer(); openConfirmModal('resetDemo')"
                    class="flex-1 py-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400 text-xs font-bold border border-rose-200 dark:border-rose-800"
                    data-i18n="clearDemoBtn">Reset All Data</button>
            </div>
        </div>
    </div>

    <!-- ===================================================================== -->
    <!-- MODAL 1: ADD / EDIT TRANSACTION (INCOME & EXPENSE)                    -->
    <!-- ===================================================================== -->
    <div id="transaction-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
        <div onclick="closeTransactionModal()" class="absolute inset-0 bg-slate-950/60 backdrop-blur-xs"></div>
        <div
            class="relative bg-white dark:bg-slate-900 rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800 max-h-[92vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 id="tx-modal-title" class="text-lg font-extrabold">Add Transaction</h3>
                <button onclick="closeTransactionModal()"
                    class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 hover:text-slate-800">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Type Switcher Tabs -->
            <div class="grid grid-cols-2 gap-2 p-1 rounded-2xl bg-slate-100 dark:bg-slate-800 mb-5">
                <button type="button" id="tx-tab-expense" onclick="setTxModalType('expense')"
                    class="py-2.5 rounded-xl text-xs font-extrabold transition flex items-center justify-center gap-2 bg-[#F42A41] text-white shadow-sm">
                    <i class="fa-solid fa-arrow-trend-down"></i>
                    <span data-i18n="expenseLabel">Expense (খরচ)</span>
                </button>
                <button type="button" id="tx-tab-income" onclick="setTxModalType('income')"
                    class="py-2.5 rounded-xl text-xs font-extrabold transition flex items-center justify-center gap-2 text-slate-600 dark:text-slate-300">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                    <span data-i18n="incomeLabel">Income (আয়)</span>
                </button>
            </div>

            <form id="tx-form" onsubmit="handleTransactionSubmit(event)" class="space-y-4">
                <input type="hidden" id="tx-edit-id" value="" />
                <input type="hidden" id="tx-type" value="expense" />

                <!-- Amount Input -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1"
                        data-i18n="amountBDT">Amount (৳ BDT) *</label>
                    <div class="relative">
                        <span
                            class="absolute left-4 top-1/2 -translate-y-1/2 text-lg font-extrabold text-[#006A4E] dark:text-emerald-400">৳</span>
                        <input type="number" id="tx-amount" step="0.01" min="1" required placeholder="0.00"
                            class="w-full pl-10 pr-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-lg font-extrabold focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                    </div>
                </div>

                <!-- Title / Source -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1"
                        data-i18n="titleSource">Title / Source *</label>
                    <input type="text" id="tx-title" required placeholder="e.g., Canteen Lunch / HSC Tuition"
                        class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                </div>

                <!-- Category & Payment Method -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1"
                            data-i18n="categoryLabel">Category *</label>
                        <select id="tx-category" required
                            class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1"
                            data-i18n="paymentMethodLabel">Payment Method *</label>
                        <select id="tx-method" required
                            class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
                    </div>
                </div>

                <!-- Date -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1"
                        data-i18n="dateLabel">Date *</label>
                    <input type="date" id="tx-date" required
                        class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                </div>

                <!-- Notes -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1"
                        data-i18n="notesOptional">Notes (Optional)</label>
                    <input type="text" id="tx-notes" placeholder="e.g., Paid via bKash merchant, shared with friends..."
                        class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                </div>

                <div class="pt-2 flex gap-2.5">
                    <button type="button" onclick="closeTransactionModal()"
                        class="flex-1 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 font-bold text-xs text-slate-600 dark:text-slate-300 hover:bg-slate-200"
                        data-i18n="cancelBtn">Cancel</button>
                    <button type="submit" id="tx-submit-btn"
                        class="flex-1 py-3 rounded-2xl bg-[#006A4E] hover:bg-emerald-700 text-white font-extrabold text-xs shadow-glow-green"
                        data-i18n="saveTxBtn">Save Entry</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===================================================================== -->
    <!-- MODAL 2: CONFIRMATION DIALOG (NO alert/confirm USED)                  -->
    <!-- ===================================================================== -->
    <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
        <div onclick="closeConfirmModal()" class="absolute inset-0 bg-slate-950/60 backdrop-blur-xs"></div>
        <div
            class="relative bg-white dark:bg-slate-900 rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800 text-center">
            <div
                class="w-14 h-14 rounded-2xl bg-rose-100 dark:bg-rose-950/60 text-[#F42A41] flex items-center justify-center text-2xl mx-auto mb-4">
                <i class="fa-solid fa-triangle-exclamation"></i>

            return {
                settings: {
                    lang: 'en',

        let currentRoute = 'dashboard';

        let selectedCalendarDate = toISODate(new Date());
        let txFilters = {
            search: '',
            type: 'all',
            category: 'all',

            doughnutChart: null,
            reportMethodChart: null,

        function toISODate(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getRelativeDate(daysOffset) {
            const d = new Date();
            d.setDate(d.getDate() + daysOffset);
            return toISODate(d);
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY_FRESH);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    const fresh = getDefaultFreshState();
                    appState = {
                        ...fresh,
                        ...parsed,
                        settings: { ...fresh.settings, ...(parsed.settings || {}) },
                        budgets: { ...fresh.budgets, ...(parsed.budgets || {}) },
                    };
                } else {
                    appState = getDefaultFreshState();
                    saveState();
                }
            } catch (e) {
                console.error('Failed to load state:', e);
                appState = getDefaultFreshState();
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY_FRESH, JSON.stringify(appState));
            } catch (e) {
                console.error('Failed to save state:', e);
            }
        }

        // =========================================================================
        // 3. LOCALIZATION, BDT FORMATTING & BANGLA NUMERAL HELPERS
        // =========================================================================
        function t(key) {
            const lang = appState.settings.lang || 'en';
            return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
        }

        function toBanglaDigits(str) {
            if (!appState.settings.banglaDigits) return String(str);
            const map = { '0': '০', '1': '১', '2': '২', '3': '৩', '4': '৪', '5': '৫', '6': '৬', '7': '৭', '8': '৮', '9': '৯' };
            return String(str).replace(/[0-9]/g, (d) => map[d]);
        }

        function formatNum(num) {
            const formatted = Number(num || 0).toLocaleString('en-IN', {
                maximumFractionDigits: 2,
                minimumFractionDigits: Number(num) % 1 !== 0 ? 2 : 0,
            });
            return toBanglaDigits(formatted);
        }

        function formatBDT(amount) {
            return `৳${formatNum(amount)}`;
        }

        function formatDateDisplay(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr + 'T00:00:00');
            if (isNaN(d.getTime())) return isoStr;
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            const str = d.toLocaleDateString(appState.settings.lang === 'bn' ? 'bn-BD' : 'en-GB', options);
            return toBanglaDigits(str);
        }

        function getAllExpenseCategories() {
            return [...DEFAULT_EXPENSE_CATEGORIES, ...(appState.customExpenseCategories || [])];
        }

        function getCategoryObj(id, type = 'expense') {
            const pool = type === 'income' ? DEFAULT_INCOME_CATEGORIES : getAllExpenseCategories();
            return pool.find((c) => c.id === id) || {
                id,
                en: id,
                bn: id,
                icon: 'fa-tag',
                color: '#64748B',
                bg: 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300'
            };
        }

        function getCatLabel(catObj) {
            return appState.settings.lang === 'bn' ? catObj.bn : catObj.en;
        }

        function getMethodObj(id) {
            return PAYMENT_METHODS.find((m) => m.id === id) || PAYMENT_METHODS[0];
        }

        function getMethodLabel(methodObj) {
            return appState.settings.lang === 'bn' ? methodObj.bn : methodObj.en;
        }

        function navigateTo(route) {
            currentRoute = route;
            renderNavigation();
            renderCurrentView();

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const colors = {
                success: 'bg-[#006A4E] text-white border-emerald-400',
                error: 'bg-[#F42A41] text-white border-rose-400',
                info: 'bg-slate-800 text-white border-slate-600',
            };
            const icons = {
                success: 'fa-circle-check',
                error: 'fa-circle-exclamation',
                info: 'fa-circle-info',
            };
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl border text-xs font-bold transform transition-all duration-300 translate-x-4 opacity-0 ${colors[type] || colors.info}`;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-sm"></i><span>${message}</span>`;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-4', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-4');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // =========================================================================
        // 5. FINANCIAL CALCULATIONS & ANALYTICS HELPERS
        // =========================================================================
        function getMetrics() {
            const todayISO = toISODate(new Date());
            const currentMonthPrefix = todayISO.slice(0, 7); // YYYY-MM

            let totalIncome = 0;
            let totalExpense = 0;
            let todayExpense = 0;
            let monthIncome = 0;
            let monthExpense = 0;

            appState.transactions.forEach((tx) => {
                const amt = Number(tx.amount) || 0;
                if (tx.type === 'income') {
                    totalIncome += amt;
                    if (tx.date.startsWith(currentMonthPrefix)) monthIncome += amt;
                } else {
                    totalExpense += amt;
                    if (tx.date === todayISO) todayExpense += amt;
                    if (tx.date.startsWith(currentMonthPrefix)) monthExpense += amt;
                }
            });

            const totalSavings = (appState.savings || []).reduce((sum, s) => sum + (Number(s.saved) || 0), 0);
            const balance = totalIncome - totalExpense;

            return {
                totalIncome,
                totalExpense,
                balance,
                totalSavings,
                todayExpense,
                monthIncome,
                monthExpense,
                currentMonthPrefix,
            };
        }

        function generateNotifications() {
            const notes = [];
            const lang = appState.settings.lang;
            const metrics = getMetrics();
            const overallLimit = Number(appState.budgets.overallMonthly) || 0;

            // 1. Overall Budget Check
            if (overallLimit > 0) {
                const pct = (metrics.monthExpense / overallLimit) * 100;
                if (pct >= 100) {
                    notes.push({
                        type: 'danger',
                        icon: 'fa-fire',
                        title: lang === 'bn' ? 'মাসিক বাজেট অতিক্রম করেছে!' : 'Monthly Budget Exceeded!',
                        desc: lang === 'bn'
                            ? `আপনি নির্ধারিত ${formatBDT(overallLimit)} বাজেটের বিপরীতে ${formatBDT(metrics.monthExpense)} খরচ করেছেন।`
                            : `You have spent ${formatBDT(metrics.monthExpense)} against your ${formatBDT(overallLimit)} monthly limit.`,
                    });
                } else if (pct >= 80) {
                    notes.push({
                        type: 'warning',
                        icon: 'fa-triangle-exclamation',
                        title: lang === 'bn' ? 'বাজেট সতর্কতা (৮০%+ ব্যবহৃত)' : 'Budget Warning (80%+ Used)',
                        desc: lang === 'bn'
                            ? `মাসিক বাজেটের ${formatNum(Math.round(pct))}% ইতিমধ্যে খরচ হয়ে গেছে।`
                            : `You've used ${formatNum(Math.round(pct))}% of your monthly budget.`,
                    });
                }
            }

            // 2. Category Budget Warnings
            Object.entries(appState.budgets.categories || {}).forEach(([catId, limit]) => {
                if (!limit || limit <= 0) return;
                const spent = appState.transactions
                    .filter((tx) => tx.type === 'expense' && tx.category === catId && tx.date.startsWith(metrics.currentMonthPrefix))
                    .reduce((s, tx) => s + Number(tx.amount), 0);
                const catObj = getCategoryObj(catId, 'expense');
                if (spent >= limit) {
                    notes.push({
                        type: 'danger',
                        icon: catObj.icon,
                        title: lang === 'bn' ? `${catObj.bn} বাজেট সীমা অতিক্রম!` : `${catObj.en} Budget Exceeded!`,
                        desc: `${formatBDT(spent)} / ${formatBDT(limit)}`,
                    });
                } else if (spent >= limit * 0.8) {
                    notes.push({
                        type: 'warning',
                        icon: catObj.icon,
                        title: lang === 'bn' ? `${catObj.bn} বাজেট ৮০% পূর্ণ` : `${catObj.en} Budget at 80%+`,
                        desc: `${formatBDT(spent)} / ${formatBDT(limit)}`,
                    });
                }
            });

            // 3. Debt Due Reminders
            (appState.debts || []).forEach((d) => {
                const rem = Number(d.amount) - Number(d.paid);
                if (rem > 0) {
                    notes.push({
                        type: 'info',
                        icon: 'fa-handshake',
                        title: d.kind === 'borrowed'
                            ? (lang === 'bn' ? `${d.person}-কে ধার পরিশোধ বাকি` : `Repayment due to ${d.person}`)
                            : (lang === 'bn' ? `${d.person}-এর কাছ থেকে পাওনা` : `Collect lent money from ${d.person}`),
                        desc: `${lang === 'bn' ? 'বাকি:' : 'Remaining:'} ${formatBDT(rem)} • ${lang === 'bn' ? 'তারিখ:' : 'Due:'} ${formatDateDisplay(d.dueDate)}`,
                    });
                }
            });

            // 4. Recurring Reminders
            (appState.recurring || []).filter((r) => r.active).forEach((r) => {
                notes.push({
                    type: 'success',
                    icon: 'fa-rotate',
                    title: lang === 'bn' ? `নিয়মিত লেনদেন: ${r.title}` : `Recurring Schedule: ${r.title}`,
                    desc: `${formatBDT(r.amount)} (${r.frequency}) • ${formatDateDisplay(r.nextDate)}`,
                });
            });

            return notes;
        }

            const select = document.getElementById('tx-category');
            const list = type === 'income' ? DEFAULT_INCOME_CATEGORIES : getAllExpenseCategories();
            select.innerHTML = list

                .join('');

        function populatePaymentMethodOptions() {
            const select = document.getElementById('tx-method');
            select.innerHTML = PAYMENT_METHODS

                .join('');

        function setTxModalType(type) {
            document.getElementById('tx-type').value = type;
            const expBtn = document.getElementById('tx-tab-expense');
            const incBtn = document.getElementById('tx-tab-income');

            if (type === 'expense') {
                expBtn.className = 'py-2.5 rounded-xl text-xs font-extrabold transition flex items-center justify-center gap-2 bg-[#F42A41] text-white shadow-sm';

        function openTransactionModal(defaultType = 'expense', editTxId = null) {
            const modal = document.getElementById('transaction-modal');
            populatePaymentMethodOptions();
            document.getElementById('tx-form').reset();
            document.getElementById('tx-edit-id').value = '';

            if (editTxId) {
                const tx = appState.transactions.find((t) => t.id === editTxId);
                if (!tx) return;
                document.getElementById('tx-modal-title').textContent =
                    appState.settings.lang === 'bn' ? 'লেনদেন সম্পাদনা করুন' : 'Edit Transaction';
                document.getElementById('tx-edit-id').value = tx.id;
                setTxModalType(tx.type);
                document.getElementById('tx-amount').value = tx.amount;
                document.getElementById('tx-title').value = tx.title;
                document.getElementById('tx-category').value = tx.category;
                document.getElementById('tx-method').value = tx.method;
                document.getElementById('tx-date').value = tx.date;
                document.getElementById('tx-notes').value = tx.notes || '';
            } else {
                document.getElementById('tx-modal-title').textContent =
                    appState.settings.lang === 'bn' ? 'নতুন হিসাব যোগ করুন' : 'Add New Entry';
                setTxModalType(defaultType);
                document.getElementById('tx-date').value = toISODate(new Date());
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');

        function closeTransactionModal() {
            const modal = document.getElementById('transaction-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function handleTransactionSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('tx-edit-id').value;
            const type = document.getElementById('tx-type').value;
            const amount = parseFloat(document.getElementById('tx-amount').value);
            const title = document.getElementById('tx-title').value.trim();
            const category = document.getElementById('tx-category').value;
            const method = document.getElementById('tx-method').value;
            const date = document.getElementById('tx-date').value;
            const notes = document.getElementById('tx-notes').value.trim();

            if (!amount || amount <= 0 || !title || !date) {
                showToast('Please enter valid amount, title, and date.', 'error');
                return;
            }

            if (editId) {
                const idx = appState.transactions.findIndex((t) => t.id === editId);
                if (idx !== -1) {
                    appState.transactions[idx] = { ...appState.transactions[idx], type, amount, title, category, method, date, notes };
                    showToast(appState.settings.lang === 'bn' ? 'লেনদেন আপডেট হয়েছে!' : 'Transaction updated!', 'success');
                }
            } else {
                const newId = 'TX-' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 100);
                appState.transactions.unshift({ id: newId, type, amount, title, category, method, date, notes });
                showToast(appState.settings.lang === 'bn' ? 'নতুন লেনদেন সংরক্ষিত হয়েছে!' : 'Transaction added successfully!', 'success');
            }

            saveState();
            closeTransactionModal();
            updateStaticTranslations();
            renderCurrentView();
        }

            const modal = document.getElementById('detail-modal');

            modal.classList.add('hidden');

        // Confirmation Modal Logic
        let pendingConfirmAction = null;
        function openConfirmModal(actionType, payload = null) {
            const lang = appState.settings.lang;
            const titleEl = document.getElementById('confirm-title');
            const msgEl = document.getElementById('confirm-message');

            if (actionType === 'deleteTx') {
                titleEl.textContent = lang === 'bn' ? 'লেনদেনটি মুছে ফেলবেন?' : 'Delete this transaction?';
                msgEl.textContent = lang === 'bn' ? 'মুছে ফেললে এই হিসাবটি আর ফিরে পাওয়া যাবে না।' : 'This transaction will be permanently removed from your ledger.';
                pendingConfirmAction = () => deleteTransaction(payload);
            } else if (actionType === 'resetDemo') {
                titleEl.textContent = lang === 'bn' ? 'সব ডেটা মুছে ফেলবেন?' : 'Clear All Financial Data?';
                msgEl.textContent = lang === 'bn'
                    ? 'এটি সকল ডেমো ও ব্যক্তিগত লেনদেন মুছে খালি করে দেবে।'
                    : 'This will clear all sample/saved transactions, goals, and debts so you can start fresh.';
                pendingConfirmAction = () => clearAllData();
            } else if (actionType === 'deleteSavings') {
                titleEl.textContent = lang === 'bn' ? 'সঞ্চয় লক্ষ্যটি মুছবেন?' : 'Delete Savings Goal?';
                msgEl.textContent = lang === 'bn' ? 'এই সঞ্চয় কার্ডটি মুছে ফেলা হবে।' : 'This savings goal card will be removed.';
                pendingConfirmAction = () => {
                    appState.savings = appState.savings.filter((s) => s.id !== payload);
                    saveState();
                    updateStaticTranslations();
                    renderCurrentView();
                    showToast('Savings goal removed', 'info');
                };
            } else if (actionType === 'deleteDebt') {
                titleEl.textContent = lang === 'bn' ? 'ধার/দেনার রেকর্ড মুছবেন?' : 'Delete Debt Record?';
                msgEl.textContent = lang === 'bn' ? 'এই রেকর্ডটি তালিকা থেকে মুছে যাবে।' : 'This debt record will be removed.';

                    appState.debts = appState.debts.filter((d) => d.id !== payload);
                    saveState();
                    updateStaticTranslations();
                    renderCurrentView();
                    showToast('Debt record removed', 'info');
                };

            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

                    renderBudgets(container);
                    break;
                case 'savings':

                    break;
                case 'debts':

            return `

        function initDashboardCharts() {
            if (typeof Chart === 'undefined') return; // Chart.js failed to load (offline) — skip charts, keep app working

            const isDark = appState.settings.theme === 'dark';
            const textColor = isDark ? '#CBD5E1' : '#475569';
            const gridColor = isDark ? 'rgba(148, 163, 184, 0.1)' : 'rgba(148, 163, 184, 0.2)';
            const lang = appState.settings.lang;

            // 1. Income vs Expense Bar Chart (Last 6 Months)
            const barCtx = document.getElementById('dashboardBarChart');
            if (barCtx) {
                const months = [];
                const incomeSeries = [];
                const expenseSeries = [];
                const now = new Date();

                for (let i = 5; i >= 0; i--) {
                    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    const label = d.toLocaleDateString(lang === 'bn' ? 'bn-BD' : 'en-US', { month: 'short' });
                    months.push(label);

                    const inc = appState.transactions
                        .filter((t) => t.type === 'income' && t.date.startsWith(ym))
                        .reduce((s, t) => s + Number(t.amount), 0);
                    const exp = appState.transactions
                        .filter((t) => t.type === 'expense' && t.date.startsWith(ym))
                        .reduce((s, t) => s + Number(t.amount), 0);

                    incomeSeries.push(inc);
                    expenseSeries.push(exp);
                }

                chartInstances.barChart = new Chart(barCtx, {
                    type: 'bar',
                    data: {
                        labels: months,
                        datasets: [
                            {
                                label: lang === 'bn' ? 'আয় (Income)' : 'Income (৳)',
                                data: incomeSeries,
                                backgroundColor: '#10B981',
                                borderRadius: 8,
                            },
                            {
                                label: lang === 'bn' ? 'খরচ (Expense)' : 'Expense (৳)',
                                data: expenseSeries,
                                backgroundColor: '#F42A41',
                                borderRadius: 8,
                            },
                        ],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: textColor, font: { family: 'Inter, Noto Sans Bengali', weight: 'bold' } } },
                        },
                        scales: {
                            x: { ticks: { color: textColor }, grid: { display: false } },
                            y: { ticks: { color: textColor }, grid: { color: gridColor } },
                        },
                    },
                });
            }

            // 2. Expense Category Doughnut Chart
            const doughnutCtx = document.getElementById('dashboardDoughnutChart');
            if (doughnutCtx) {
                const catTotals = {};
                appState.transactions
                    .filter((t) => t.type === 'expense')
                    .forEach((t) => {
                        catTotals[t.category] = (catTotals[t.category] || 0) + Number(t.amount);
                    });

                const entries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
                const labels = entries.map(([id]) => getCatLabel(getCategoryObj(id, 'expense')));
                const values = entries.map(([, val]) => val);
                const colors = entries.map(([id]) => getCategoryObj(id, 'expense').color);
                const emptyLabel = lang === 'bn' ? 'কোনো খরচ নেই' : 'No Expenses Yet';

                chartInstances.doughnutChart = new Chart(doughnutCtx, {
                    type: 'doughnut',
                    data: {
                        labels: labels.length ? labels : [emptyLabel],
                        datasets: [
                            {
                                data: values.length ? values : [1],
                                backgroundColor: colors.length ? colors : [isDark ? '#1E293B' : '#E2E8F0'],
                                borderWidth: 2,
                                borderColor: isDark ? '#0F172A' : '#FFFFFF',
                            },
                        ],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '65%',
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { boxWidth: 10, color: textColor, font: { size: 11, family: 'Inter, Noto Sans Bengali' } },
                            },
                        },
                    },
                });
            }
        }

        // -------------------------------------------------------------------------
        // VIEW 2: TRANSACTIONS LEDGER (লেনদেন)
        // -------------------------------------------------------------------------
        function renderTransactions(container) {
            const lang = appState.settings.lang;
            const allCats = [...getAllExpenseCategories(), ...DEFAULT_INCOME_CATEGORIES];

            // Filter & Sort logic
            let filtered = appState.transactions.filter((tx) => {
                if (txFilters.type !== 'all' && tx.type !== txFilters.type) return false;
                if (txFilters.category !== 'all' && tx.category !== txFilters.category) return false;
                if (txFilters.method !== 'all' && tx.method !== txFilters.method) return false;
                if (txFilters.dateFrom && tx.date < txFilters.dateFrom) return false;
                if (txFilters.dateTo && tx.date > txFilters.dateTo) return false;
                if (txFilters.search) {
                    const q = txFilters.search.toLowerCase();
                    const matchTitle = tx.title.toLowerCase().includes(q);
                    const matchNotes = (tx.notes || '').toLowerCase().includes(q);
                    const matchAmount = String(tx.amount).includes(q);
                    const matchId = tx.id.toLowerCase().includes(q);
                    if (!matchTitle && !matchNotes && !matchAmount && !matchId) return false;
                }
                return true;
            });

            filtered.sort((a, b) => {
                if (txFilters.sort === 'newest') return b.date.localeCompare(a.date);
                if (txFilters.sort === 'oldest') return a.date.localeCompare(b.date);
                if (txFilters.sort === 'highest') return Number(b.amount) - Number(a.amount);
                if (txFilters.sort === 'lowest') return Number(a.amount) - Number(b.amount);
                return 0;
            });

            const sumInc = filtered.filter((t) => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
            const sumExp = filtered.filter((t) => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);

            container.innerHTML = `
        <!-- Top Action & Summary Strip -->

          <div class="flex flex-wrap items-center gap-4 text-xs">
            <span class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold">
              ${lang === 'bn' ? 'মোট রেকর্ড:' : 'Showing:'} <strong>${formatNum(filtered.length)}</strong>
            </span>
            <span class="text-[#006A4E] dark:text-emerald-400 font-extrabold">
              ${lang === 'bn' ? 'আয়:' : 'Income:'} +${formatBDT(sumInc)}
            </span>
            <span class="text-[#F42A41] font-extrabold">
              ${lang === 'bn' ? 'খরচ:' : 'Expense:'} -${formatBDT(sumExp)}
            </span>
          </div>
          <div class="flex gap-2">
            <button onclick="openTransactionModal('income')" class="px-3.5 py-2 rounded-xl bg-[#006A4E] text-white text-xs font-bold hover:bg-emerald-700">
              + ${lang === 'bn' ? 'আয়' : 'Income'}
            </button>
            <button onclick="openTransactionModal('expense')" class="px-3.5 py-2 rounded-xl bg-[#F42A41] text-white text-xs font-bold hover:bg-rose-600">
              + ${lang === 'bn' ? 'খরচ' : 'Expense'}
            </button>
          </div>
        </div>

        <!-- Search & Filter Controls -->
        <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-soft space-y-3">
          <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <div class="md:col-span-2 relative">
              <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
              <input type="text" id="tx-search-input" value="${txFilters.search}" oninput="onTxSearchInput(this)" placeholder="${t('searchPlaceholder')}" class="w-full pl-9 pr-4 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            </div>
            <select onchange="txFilters.type = this.value; renderCurrentView()" class="px-3.5 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-bold">
              <option value="all" ${txFilters.type === 'all' ? 'selected' : ''}>${t('allTypes')}</option>
              <option value="income" ${txFilters.type === 'income' ? 'selected' : ''}>${t('incomeLabel')}</option>
              <option value="expense" ${txFilters.type === 'expense' ? 'selected' : ''}>${t('expenseLabel')}</option>
            </select>
            <select onchange="txFilters.sort = this.value; renderCurrentView()" class="px-3.5 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-bold">
              <option value="newest" ${txFilters.sort === 'newest' ? 'selected' : ''}>${t('sortNewest')}</option>
              <option value="oldest" ${txFilters.sort === 'oldest' ? 'selected' : ''}>${t('sortOldest')}</option>
              <option value="highest" ${txFilters.sort === 'highest' ? 'selected' : ''}>${t('sortHighest')}</option>
              <option value="lowest" ${txFilters.sort === 'lowest' ? 'selected' : ''}>${t('sortLowest')}</option>
            </select>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
            <select onchange="txFilters.category = this.value; renderCurrentView()" class="px-3.5 py-2 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-semibold">
              <option value="all">${t('allCategories')}</option>
              ${allCats.map((c) => `<option value="${c.id}" ${txFilters.category === c.id ? 'selected' : ''}>${getCatLabel(c)}</option>`).join('')}
            </select>
            <select onchange="txFilters.method = this.value; renderCurrentView()" class="px-3.5 py-2 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-semibold">
              <option value="all">${t('allMethods')}</option>
              ${PAYMENT_METHODS.map((m) => `<option value="${m.id}" ${txFilters.method === m.id ? 'selected' : ''}>${getMethodLabel(m)}</option>`).join('')}

            <div class="flex gap-2">
              <input type="date" value="${txFilters.dateTo}" onchange="txFilters.dateTo = this.value; renderCurrentView()" class="flex-1 px-3 py-2 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-semibold" title="To Date" />
              <button onclick="txFilters = { search: '', type: 'all', category: 'all', method: 'all', dateFrom: '', dateTo: '', sort: 'newest' }; renderCurrentView()" class="px-3 py-2 rounded-2xl bg-slate-200 dark:bg-slate-700 text-xs font-bold hover:bg-slate-300" title="${t('resetFilters')}">
                <i class="fa-solid fa-rotate-left"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Transactions List -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-soft">
          ${filtered.length === 0
                    ? `<div class="text-center py-12">
                  <i class="fa-solid fa-receipt text-4xl text-slate-300 dark:text-slate-700 mb-3"></i>
                  <p class="text-sm font-bold text-slate-500">${t('noTransactionsFound')}</p>
                </div>`
                    : `<div class="space-y-2.5">
                  ${filtered
                        .map((tx) => {

                            const method = getMethodObj(tx.method);
                            const isInc = tx.type === 'income';
                            return `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3.5 rounded-2xl bg-slate-50/80 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 hover:border-emerald-300 dark:hover:border-emerald-800 transition">
                          <div onclick="openDetailModal('${tx.id}')" class="cursor-pointer flex items-center gap-3.5 min-w-0 flex-1">
                            <div class="w-11 h-11 rounded-2xl ${cat.bg} flex items-center justify-center text-base shrink-0">
                              <i class="fa-solid ${cat.icon}"></i>
                            </div>
                            <div class="min-w-0">
                              <div class="flex items-center gap-2">
                                <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-200/70 dark:bg-slate-700 text-slate-600 dark:text-slate-300">${tx.id}</span>
                                <p class="text-sm font-extrabold truncate">${tx.title}</p>
                              </div>
                              <div class="flex flex-wrap items-center gap-2 mt-1">
                                <span class="text-[11px] text-slate-500"><i class="fa-regular fa-calendar mr-1"></i>${formatDateDisplay(tx.date)}</span>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${cat.bg}">${getCatLabel(cat)}</span>

                            <p class="text-base font-extrabold ${isInc ? 'text-[#006A4E] dark:text-emerald-400' : 'text-[#F42A41]'}">

                            <div class="flex items-center gap-1.5">
                              <button onclick="openDetailModal('${tx.id}')" class="p-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-emerald-600 text-xs" title="View">
                                <i class="fa-solid fa-eye"></i>
                              </button>
                              <button onclick="openTransactionModal('${tx.type}', '${tx.id}')" class="p-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-blue-600 text-xs" title="Edit">
                                <i class="fa-solid fa-pen"></i>

                                <i class="fa-solid fa-trash"></i>
                              </button>

                }

        // Keeps keyboard focus in the search box while the list re-renders
        function onTxSearchInput(inputEl) {
            txFilters.search = inputEl.value;
            const caret = inputEl.selectionStart;
            renderCurrentView();
            const fresh = document.getElementById('tx-search-input');
            if (fresh) {
                fresh.focus();
                try { fresh.setSelectionRange(caret, caret); } catch (e) { }
            }
        }

        // -------------------------------------------------------------------------
        // VIEW 3: BUDGETS MANAGEMENT (বাজেট ব্যবস্থাপনা)
        // -------------------------------------------------------------------------
        function renderBudgets(container) {
            const lang = appState.settings.lang;
            const m = getMetrics();
            const overall = Number(appState.budgets.overallMonthly) || 0;
            const overallPct = overall > 0 ? Math.round((m.monthExpense / overall) * 100) : 0;
            const allExpCats = getAllExpenseCategories();

            container.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">

          <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-soft h-fit">
            <h3 class="text-base font-extrabold mb-4 flex items-center gap-2">
              <i class="fa-solid fa-sliders text-[#006A4E]"></i>
              <span>${t('addBudgetGoal')}</span>
            </h3>

            <!-- Overall Monthly Budget Input -->
            <form onsubmit="handleUpdateOverallBudget(event)" class="space-y-3 pb-5 mb-5 border-b border-slate-100 dark:border-slate-800">
              <label class="block text-xs font-bold text-slate-600 dark:text-slate-300">${t('overallMonthlyBudget')} (৳)</label>
              <div class="flex gap-2">
                <input type="number" id="overall-budget-input" min="100" required value="${overall > 0 ? overall : ''}" placeholder="e.g., 8000" class="flex-1 px-3.5 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-extrabold" />
                <button type="submit" class="px-4 py-2.5 rounded-2xl bg-[#006A4E] text-white text-xs font-extrabold hover:bg-emerald-700">Save</button>
              </div>
            </form>

            <!-- Category Budget Form -->
            <form onsubmit="handleSetCategoryBudget(event)" class="space-y-3">
              <label class="block text-xs font-bold text-slate-600 dark:text-slate-300">${t('categoryLabel')}</label>
              <select id="budget-cat-select" class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-bold">
                ${allExpCats.map((c) => `<option value="${c.id}">${getCatLabel(c)}</option>`).join('')}
              </select>
              <label class="block text-xs font-bold text-slate-600 dark:text-slate-300">${lang === 'bn' ? 'মাসিক বাজেট সীমা (৳)' : 'Monthly Limit (৳)'}</label>
              <input type="number" id="budget-cat-limit" min="50" required placeholder="e.g., 2500" class="w-full px-3.5 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-extrabold" />
              <button type="submit" class="w-full py-2.5 rounded-2xl bg-gradient-to-r from-[#006A4E] to-teal-600 text-white text-xs font-extrabold shadow-glow-green">
                ${lang === 'bn' ? 'বিভাগীয় বাজেট সেট করুন' : 'Set Category Budget'}
              </button>
            </form>
          </div>

          <!-- Budget Progress Cards -->
          <div class="lg:col-span-2 space-y-4">
            <!-- Overall Monthly Card -->
            <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-soft">
              <div class="flex items-center justify-between mb-2">
                <h4 class="text-sm font-extrabold">${t('overallMonthlyBudget')} (${m.currentMonthPrefix})</h4>
                <span class="px-2.5 py-1 rounded-full text-xs font-extrabold ${overallPct >= 100
                    ? 'bg-rose-100 text-[#F42A41]'
                    : overallPct >= 80
                        ? 'bg-amber-100 text-amber-700'
                        : 'bg-emerald-100 text-[#006A4E]'
                }">${formatNum(overallPct)}%</span>
              </div>
              <div class="flex justify-between text-xs text-slate-500 mb-2">
                <span>${t('spent')}: <strong class="text-slate-900 dark:text-white">${formatBDT(m.monthExpense)}</strong></span>
                <span>${t('remaining')}: <strong class="${overall - m.monthExpense >= 0 ? 'text-[#006A4E]' : 'text-[#F42A41]'}">${formatBDT(overall - m.monthExpense)}</strong></span>
              </div>
              <div class="w-full h-3.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                <div class="h-full rounded-full ${overallPct >= 100 ? 'bg-[#F42A41]' : overallPct >= 80 ? 'bg-amber-500' : 'bg-[#10B981]'}" style="width: ${Math.min(100, overallPct)}%"></div>
              </div>
            </div>

            <!-- Category-wise Progress List -->
            <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-soft">
              <h4 class="text-sm font-extrabold mb-4">${t('categoryBudgets')}</h4>
              ${Object.keys(appState.budgets.categories || {}).length === 0
                    ? `<div class="py-10 text-center text-xs text-slate-400">
                      <i class="fa-solid fa-chart-pie text-3xl mb-2 block text-slate-300 dark:text-slate-700"></i>
                      ${lang === 'bn' ? 'বাম পাশের ফর্ম থেকে খাবার, যাতায়াত বা শিক্ষার জন্য বিভাগীয় বাজেট যোগ করুন।' : 'Use the form on the left to set limits for Food, Transport, Education, etc.'}
                    </div>`
                    : `<div class="space-y-4">
                      ${Object.entries(appState.budgets.categories || {})
                        .map(([catId, limit]) => {
                            const cat = getCategoryObj(catId, 'expense');
                            const spent = appState.transactions
                                .filter((tx) => tx.type === 'expense' && tx.category === catId && tx.date.startsWith(m.currentMonthPrefix))

                            const pct = limit > 0 ? Math.round((spent / limit) * 100) : 0;
                            const barColor = pct >= 100 ? 'bg-[#F42A41]' : pct >= 80 ? 'bg-amber-500' : 'bg-[#10B981]';
                            return `
                            <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-800">
                              <div class="flex items-center justify-between gap-2 mb-2">
                                <div class="flex items-center gap-2.5">

                                  <div>
                                    <p class="text-xs font-extrabold">${getCatLabel(cat)}</p>

                                  </div>
                                </div>
                                <div class="flex items-center gap-2">
                                  <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${pct >= 100 ? 'bg-rose-100 text-[#F42A41]' : pct >= 80 ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-[#006A4E]'

                                  <button onclick="deleteCategoryBudget('${catId}')" class="text-slate-400 hover:text-rose-500 text-xs p-1" title="Remove">

                                  </button>
                                </div>
                              </div>
                              <div class="w-full h-2.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">

                            </div>

                        })
                        .join('')}
                    </div>`
                }
            </div>
          </div>
        </div>
      `;
        }

        function handleUpdateOverallBudget(e) {
            e.preventDefault();
            const val = parseFloat(document.getElementById('overall-budget-input').value);
            if (val > 0) {
                appState.budgets.overallMonthly = val;
                saveState();
                updateStaticTranslations();
                renderCurrentView();
                showToast('Overall monthly budget updated!', 'success');
            }
        }

        function handleSetCategoryBudget(e) {
            e.preventDefault();
            const catId = document.getElementById('budget-cat-select').value;
            const limit = parseFloat(document.getElementById('budget-cat-limit').value);
            if (catId && limit > 0) {
                appState.budgets.categories[catId] = limit;
                saveState();
                updateStaticTranslations();
                renderCurrentView();
                showToast('Category budget saved!', 'success');
            }
        }

        function deleteCategoryBudget(catId) {
            delete appState.budgets.categories[catId];
            saveState();
            updateStaticTranslations();
            renderCurrentView();
        }

        function handleAddSavingsGoal(e) {
            e.preventDefault();
            const name = document.getElementById('sav-name').value.trim();
            const target = parseFloat(document.getElementById('sav-target').value);
            const saved = parseFloat(document.getElementById('sav-initial').value) || 0;
            const deadline = document.getElementById('sav-date').value;
            if (!name || !target || target <= 0) return;

            appState.savings.push({
                id: 'SAV-' + Date.now(),
                name,
                target,
                saved: Math.min(target, Math.max(0, saved)),
                deadline,
                icon: 'fa-piggy-bank',
                color: 'from-emerald-500 to-teal-600',
            });
            saveState();
            updateStaticTranslations();
            renderCurrentView();
            showToast('Savings goal added!', 'success');
        }

        function adjustSavings(id, direction) {
            const input = document.getElementById(`sav-step-${id}`);
            const amt = parseFloat(input ? input.value : 0);
            if (!amt || amt <= 0) return;

            const goal = appState.savings.find((s) => s.id === id);
            if (!goal) return;

        function handleAddDebt(e) {
            e.preventDefault();
            const kind = document.getElementById('debt-kind').value;
            const person = document.getElementById('debt-person').value.trim();
            const amount = parseFloat(document.getElementById('debt-amount').value);
            const dueDate = document.getElementById('debt-due').value;
            const notes = document.getElementById('debt-notes').value.trim();
            if (!person || !amount || amount <= 0) return;

            appState.debts.unshift({
                id: 'DEBT-' + Date.now(),
                kind,
                person,
                amount,
                paid: 0,
                dueDate,
                notes,
            });
            saveState();
            updateStaticTranslations();
            renderCurrentView();
            showToast('Debt record saved!', 'success');
        }

        function recordDebtRepayment(id) {
            const input = document.getElementById(`repay-amt-${id}`);
            const amt = parseFloat(input ? input.value : 0);
            const d = appState.debts.find((item) => item.id === id);
            if (!d || !amt || amt <= 0) return;
            const rem = Math.max(0, Number(d.amount) - Number(d.paid));
            d.paid = Number(d.paid) + Math.min(rem, amt);
            saveState();
            updateStaticTranslations();
            renderCurrentView();
            showToast('Repayment recorded!', 'success');
        }

        function handleAddRecurring(e) {
            e.preventDefault();
            const type = document.getElementById('rec-type').value;
            const title = document.getElementById('rec-title').value.trim();
            const amount = parseFloat(document.getElementById('rec-amount').value);
            const category = document.getElementById('rec-cat').value;
            const frequency = document.getElementById('rec-freq').value;
            const nextDate = document.getElementById('rec-date').value;
            if (!title || !amount || amount <= 0) return;

            appState.recurring.push({
                id: 'REC-' + Date.now(),
                type,
                title,
                amount,
                category,
                method: 'bkash',
                frequency,
                nextDate,
                active: true,
            });
            saveState();
            updateStaticTranslations();
            renderCurrentView();
            showToast('Recurring schedule added!', 'success');
        }

        function postRecurringNow(recId) {
            const r = appState.recurring.find((item) => item.id === recId);
            if (!r) return;
            appState.transactions.unshift({
                id: 'TX-' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 100),
                type: r.type,
                amount: r.amount,
                title: `${r.title} (${r.frequency})`,
                category: r.category,
                method: r.method || 'bkash',
                date: toISODate(new Date()),
                notes: 'Posted from recurring schedule',
            });

            const next = new Date(r.nextDate + 'T00:00:00');
            if (r.frequency === 'Daily') next.setDate(next.getDate() + 1);
            else if (r.frequency === 'Weekly') next.setDate(next.getDate() + 7);
            else next.setMonth(next.getMonth() + 1);
            r.nextDate = toISODate(next);

            saveState();
            updateStaticTranslations();
            renderCurrentView();
            showToast('Recurring entry posted to ledger!', 'success');
        }

        function deleteRecurring(recId) {
            appState.recurring = appState.recurring.filter((r) => r.id !== recId);
            saveState();
            updateStaticTranslations();
            renderCurrentView();
        }

        function exportTransactionsCSV() {
            const headers = ['ID', 'Type', 'Title', 'Amount_BDT', 'Category', 'Payment_Method', 'Date', 'Notes'];
            const rows = appState.transactions.map((tx) => [
                tx.id,
                tx.type,
                `"${(tx.title || '').replace(/"/g, '""')}"`,
                tx.amount,
                tx.category,
                tx.method,
                tx.date,
                `"${(tx.notes || '').replace(/"/g, '""')}"`,
            ]);
            // BOM so Excel reads Bangla text correctly
            const csvText = '\uFEFF' + [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');
            const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `HisabKhata_Report_${toISODate(new Date())}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast('CSV Report downloaded!', 'success');
        }
