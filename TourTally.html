        <div class="space-y-4">
          <div class="flex items-center gap-3">
            <span class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-xs shrink-0" style="background-color: ${esc(m.color || '#0d9488')}">
              ${esc(getInitials(m.name))}
            </span>
            <div>
              <div class="font-bold text-sm text-slate-900 dark:text-white">${esc(m.name)}</div>
              <div class="text-xs text-slate-500 dark:text-slate-400">${esc(tour.name)}</div>
            </div>
          </div>

          ${statusBanner}

          <div>
            <label for="member-share-textarea" class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1.5">
              Shareable Summary
            </label>
            <textarea id="member-share-textarea" rows="8" readonly
              class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 p-3 text-xs font-mono text-slate-800 dark:text-slate-100 focus:outline-none">${esc(reportText)}</textarea>
          </div>
        </div>
      `;

            const footer = `
        <button type="button" onclick="closeModal()" class="px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-medium">Close</button>
        <button type="button" onclick="copyMemberReportToClipboard('${esc(memberId)}')" class="px-3.5 py-2 rounded-lg bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 text-white text-xs font-medium">
          Copy Summary
        </button>
        <button type="button" onclick="nativeShareMemberReport('${esc(memberId)}')" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium">
          Share Report
        </button>
      `;

            openModal(`Share ${m.name}'s Report`, body, footer);
        }

        function copyMemberReportToClipboard(memberId) {
            const tour = getActiveTour();
            if (!tour) return;
            const fin = calculateTourFinancials(tour);
            const text = buildIndividualMemberReportText(tour, fin, memberId);
            const ta = document.getElementById('member-share-textarea');

            try {
                if (ta) {
                    ta.focus();
                    ta.select();
                    document.execCommand('copy');
                    showToast('Member summary copied to clipboard.');
                    return;
                }
            } catch (_) { }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => showToast('Member summary copied to clipboard.'))
                    .catch(() => showToast('Could not copy automatically; please select and copy from the box.', 'warning'));
            } else {
                showToast('Please select and copy the text from the summary box.', 'warning');
            }
        }

        async function nativeShareMemberReport(memberId) {
            const tour = getActiveTour();
            if (!tour) return;
            const fin = calculateTourFinancials(tour);
            const entry = fin.ledger[memberId];
            const text = buildIndividualMemberReportText(tour, fin, memberId);

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: `${entry?.member?.name || 'Member'} — ${tour.name}`,
                        text
                    });
                    showToast('Report shared.');
                    return;
                } catch (err) {
                    if (err && err.name === 'AbortError') return;
                }
            }

            copyMemberReportToClipboard(memberId);
        }

        function showToast(message, type = 'success', action = null) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const borderCol = type === 'error'
                ? 'border-rose-500'
                : type === 'warning'
                    ? 'border-amber-500'
                    : 'border-brand-500';

            toast.className = `pointer-events-auto bg-white dark:bg-slate-900 border-l-4 ${borderCol} border border-slate-200 dark:border-slate-800 rounded-lg shadow-lg px-3.5 py-2.5 text-xs flex items-center justify-between gap-3 transition-all`;

            const textSpan = document.createElement('span');
            textSpan.className = 'text-slate-800 dark:text-slate-100 font-medium';
            textSpan.textContent = message;
            toast.appendChild(textSpan);

            if (action && typeof action.callback === 'function') {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'px-2 py-1 rounded bg-brand-600 text-white font-semibold shrink-0 hover:bg-brand-700';
                btn.textContent = action.label;
                btn.onclick = () => {
                    action.callback();
                    toast.remove();
                };
                toast.appendChild(btn);
            }

            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 250);
            }, action ? 6000 : 3200);
        }

        /* ==========================================================================
           19. APPLICATION BOOTSTRAP
           ========================================================================== */
        function initApp() {
            appState = loadState();
            applyTheme(appState.settings.theme);

            document.getElementById('theme-toggle-desktop')?.addEventListener('click', toggleTheme);
            document.getElementById('theme-toggle-mobile')?.addEventListener('click', toggleTheme);

            document.getElementById('sidebar-tour-select')?.addEventListener('change', e => switchTour(e.target.value));
            document.getElementById('mobile-tour-select')?.addEventListener('change', e => switchTour(e.target.value));

            // Close modal on Escape key or backdrop click
            document.getElementById('modal-backdrop')?.addEventListener('click', e => {
                if (e.target.id === 'modal-backdrop') closeModal();
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') closeModal();
            });

            renderNavigation();
            renderTourSelectors();
            updateStorageIndicator();
            renderActiveView();
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>

</html>
