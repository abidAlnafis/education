    <style>
        /* Base Custom Styling & Crisp Ledger Aesthetics */
        :root {
            --bg-canvas: #f8fafc;
            --bg-surface: #ffffff;
            --border-subtle: #e2e8f0;
        }

        html.dark {
            --bg-canvas: #090d16;
            --bg-surface: #111827;
            --border-subtle: #1f2937;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-canvas);
            overflow-x: hidden;
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        /* Custom subtle scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.35);
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.55);
        }

        /* Print Stylesheet for Print-Friendly Reports */
        @media print {
            body {
                background: #ffffff !important;
                color: #0f172a !important;
            }

            #app-sidebar,
            #mobile-topbar,
            #mobile-bottomnav,
            .no-print,
            #toast-container,
            #modal-backdrop {
                display: none !important;
            }

            #main-wrapper {
                margin-left: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }

            .print-break-inside-avoid {
                break-inside: avoid;
            }

            .shadow-sm,
            .shadow,
            .shadow-lg {
                box-shadow: none !important;
            }
        }
    </style>
</head>

        /* ==========================================================================
           2. UTILITY HELPERS (Sanitization, IDs, Dates, Integer Minor Units)
           ========================================================================== */
        function esc(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function uid(prefix = 'id') {
            return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
        }

        function getInitials(name = '') {
            const parts = String(name).trim().split(/\s+/).filter(Boolean);
            if (parts.length === 0) return '?';
            if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        function todayISO() {
            const d = new Date();
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function nowDateTimeLocal() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function formatDateDisplay(isoStr) {
            if (!isoStr) return '—';
            const d = new Date(isoStr);
            if (Number.isNaN(d.getTime())) return String(isoStr).slice(0, 10);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

            const all = [...DEFAULT_CURRENCIES, ...(appState?.settings?.customCurrencies || [])];
            return all.find(c => c.code === code) || { code: code || 'BDT', symbol: code || 'BDT', name: code || 'BDT', decimals: 2 };
        }

        function toMinorUnits(majorAmount, currencyCode = 'BDT') {
            const num = parseFloat(majorAmount);
            if (!Number.isFinite(num)) return 0;
            const meta = getCurrencyMeta(currencyCode);
            const factor = Math.pow(10, meta.decimals ?? 2);
            return Math.round(num * factor);
        }

        function fromMinorUnits(minorAmount, currencyCode = 'BDT') {
            const num = Number(minorAmount) || 0;
            const meta = getCurrencyMeta(currencyCode);
            const factor = Math.pow(10, meta.decimals ?? 2);
            return Number((num / factor).toFixed(meta.decimals ?? 2));
        }

        function formatMoney(minorAmount, currencyCode = 'BDT', showSigned = false) {
            const num = Number(minorAmount) || 0;
            const meta = getCurrencyMeta(currencyCode);
            const decimals = meta.decimals ?? 2;
            const factor = Math.pow(10, decimals);
            const absMajor = Math.abs(num) / factor;
            const formattedAbs = absMajor.toLocaleString('en-US', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            });

            const prefix = showSigned
                ? (num > 0 ? '+' : num < 0 ? '-' : '')
                : (num < 0 ? '-' : '');

            return `${prefix}${meta.symbol} ${formattedAbs}`;
        }

        /* ==========================================================================
           5. STORAGE ENGINE (Validation, Quota Handling, Recovery)
           ========================================================================== */
        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) {
                    const initial = createBlankState();
                    saveState(initial, true);
                    return initial;
                }
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.tours)) {
                    throw new Error('Corrupted TourTally database structure.');
                }
                parsed.settings = {
                    theme: 'light',
                    customCategories: [],
                    customCurrencies: [],
                    lastBackupAt: null,
                    ...(parsed.settings || {})
                };
                if (parsed.tours.length === 0) {
                    parsed.activeTourId = null;
                } else if (!parsed.tours.some(t => t.id === parsed.activeTourId)) {
                    parsed.activeTourId = parsed.tours[0].id;
                }
                return parsed;
            } catch (err) {
                console.error('Storage load failed:', err);
                const corrupted = localStorage.getItem(STORAGE_KEY);
                if (corrupted) {
                    try {
                        localStorage.setItem(`${STORAGE_KEY}_corrupted_${Date.now()}`, corrupted);
                    } catch (_) { }
                }
                const recovered = createBlankState();
                saveState(recovered, true);
                setTimeout(() => {
                    showToast('Saved data had an error and was safely reset to a clean slate.', 'warning');
                }, 400);
                return recovered;
            }
        }

        function saveState(stateObj = appState, silent = false) {
            try {
                const serialized = JSON.stringify(stateObj);
                localStorage.setItem(STORAGE_KEY, serialized);
                updateStorageIndicator();
                return true;
            } catch (err) {
                console.error('LocalStorage save error:', err);
                if (!silent) {
                    showToast('Storage quota exceeded! Remove receipt images or export a JSON backup immediately.', 'error');
                }
                return false;
            }
        }

        function getStorageUsageStats() {
            let totalBytes = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                const v = localStorage.getItem(k) || '';
                totalBytes += (k.length + v.length) * 2; // UTF-16 bytes
            }
            const quotaBytes = 5 * 1024 * 1024; // ~5MB typical LocalStorage quota
            const pct = Math.min(100, Math.round((totalBytes / quotaBytes) * 100));
            return {
                usedKB: (totalBytes / 1024).toFixed(1),
                quotaMB: '5.0',
                pct
            };
        }

        function updateStorageIndicator() {
            const stats = getStorageUsageStats();
            const pctEl = document.getElementById('sidebar-storage-pct');
            const barEl = document.getElementById('sidebar-storage-bar');
            if (pctEl) pctEl.textContent = `${stats.pct}%`;
            if (barEl) {
                barEl.style.width = `${Math.max(3, stats.pct)}%`;
                barEl.className = `h-full rounded-full transition-all duration-300 ${stats.pct > 80 ? 'bg-rose-500' : stats.pct > 60 ? 'bg-amber-500' : 'bg-brand-600'

            }
        }

        /* ==========================================================================
           6. FINANCIAL ENGINE (Integer Minor Units, Anti-Double-Counting, Greedy Settlement)
           ========================================================================== */
        /**
         * Computes complete financial ledger for a tour:
         * Accounting Identity:
         *   - Total Contributions = Sum of all deposits into Shared Tour Fund.
         *   - Shared Fund Spent   = Sum of expenses where paidBy === 'SHARED_FUND'.
         *   - Shared Fund Balance = Total Contributions - Shared Fund Spent.
         *   - Member Eligible Credits = Member's Contributions to Shared Fund + Member's Direct Expense Payments.
         *   - Member Expense Share    = Sum of Member's allocated share across all expenses.
         *   - Raw Net Balance         = Member Eligible Credits - Member Expense Share.
         *   - Remaining Net Balance   = Raw Net Balance + Settlements Paid by Member - Settlements Received by Member.
         *
         * Proof of Zero-Sum Conservation:
         *   Sum(Member Contributions) + Sum(Direct Payments) = Total Contributions + (Total Expenses - Shared Fund Spent)
         *   Since Sum(Member Expense Shares) = Total Expenses:
         *   Sum(Raw Net Balances) = Total Contributions - Shared Fund Spent = Remaining Shared Fund Balance!
         *   When Shared Fund Balance > 0, that cash sits in the Shared Pool to pay creditors;
         *   or we include the Shared Fund holder / redistribute pool cash cleanly.
         */
        function calculateTourFinancials(tour) {
            const members = tour.members || [];
            const expenses = tour.expenses || [];
            const contributions = tour.contributions || [];
            const settlements = tour.settlements || [];

            let totalExpensesMinor = 0;
            let sharedFundSpentMinor = 0;
            let totalContributionsMinor = 0;
            const categoryTotals = {};

            const ledger = {};
            members.forEach(m => {
                ledger[m.id] = {
                    member: m,
                    contributedMinor: 0,
                    directPaidMinor: 0,
                    eligibleCreditMinor: 0,
                    expenseShareMinor: 0,
                    rawNetBalanceMinor: 0,
                    settlementsPaidMinor: 0,
                    settlementsReceivedMinor: 0,
                    remainingBalanceMinor: 0,
                    paidExpenses: [],
                    sharedExpenses: [],
                    memberContributions: [],
                    memberSettlements: []
                };
            });

            // 1. Tally Contributions into Shared Fund
            contributions.forEach(c => {
                const amt = Number(c.amountMinor) || 0;
                totalContributionsMinor += amt;
                if (ledger[c.memberId]) {
                    ledger[c.memberId].contributedMinor += amt;
                    ledger[c.memberId].memberContributions.push(c);
                }
            });

            // 2. Tally Expenses (Direct Payer vs Shared Fund) & Allocations
            expenses.forEach(exp => {
                const amt = Number(exp.amountMinor) || 0;
                totalExpensesMinor += amt;
                categoryTotals[exp.category] = (categoryTotals[exp.category] || 0) + amt;

                if (exp.paidBy === SHARED_FUND_ID) {
                    sharedFundSpentMinor += amt;
                } else if (ledger[exp.paidBy]) {
                    ledger[exp.paidBy].directPaidMinor += amt;
                    ledger[exp.paidBy].paidExpenses.push(exp);
                }

                (exp.allocations || []).forEach(alloc => {
                    const share = Number(alloc.shareMinor) || 0;
                    if (ledger[alloc.memberId] && share > 0) {
                        ledger[alloc.memberId].expenseShareMinor += share;
                        ledger[alloc.memberId].sharedExpenses.push({ expense: exp, shareMinor: share });
                    }
                });
            });

            // 3. Tally Completed Settlements
            settlements.forEach(s => {
                const amt = Number(s.amountMinor) || 0;
                if (ledger[s.fromMemberId]) {
                    ledger[s.fromMemberId].settlementsPaidMinor += amt;
                    ledger[s.fromMemberId].memberSettlements.push({ ...s, direction: 'paid' });
                }
                if (ledger[s.toMemberId]) {
                    ledger[s.toMemberId].settlementsReceivedMinor += amt;
                    ledger[s.toMemberId].memberSettlements.push({ ...s, direction: 'received' });
                }
            });

            // 4. Compute Member Balances
            Object.values(ledger).forEach(entry => {
                entry.eligibleCreditMinor = entry.contributedMinor + entry.directPaidMinor;
                entry.rawNetBalanceMinor = entry.eligibleCreditMinor - entry.expenseShareMinor;
                entry.remainingBalanceMinor =
                    entry.rawNetBalanceMinor + entry.settlementsPaidMinor - entry.settlementsReceivedMinor;
            });

            const sharedFundBalanceMinor = totalContributionsMinor - sharedFundSpentMinor;

            // 5. Minimum-Transfer Debt Settlement Optimization
            // Note: If Shared Tour Fund holds unspent cash (sharedFundBalanceMinor > 0) or is overdrawn (< 0),
            // include 'Shared Tour Fund' as a virtual cash node in settlement calculation so every single penny reconciles to 0!
            const suggestedTransfers = computeOptimizedTransfers(ledger, sharedFundBalanceMinor);

            // Dashboard highlights
            let highestCategory = null;
            let highestCategoryMinor = 0;
            Object.entries(categoryTotals).forEach(([cat, val]) => {
                if (val > highestCategoryMinor) {
                    highestCategoryMinor = val;
                    highestCategory = cat;
                }
            });

            let topContributor = null;
            let topContributorMinor = 0;
            Object.values(ledger).forEach(entry => {
                if (entry.eligibleCreditMinor > topContributorMinor) {
                    topContributorMinor = entry.eligibleCreditMinor;
                    topContributor = entry.member;
                }
            });

            const avgPerPersonMinor = members.length > 0 ? Math.round(totalExpensesMinor / members.length) : 0;

            return {
                totalExpensesMinor,
                totalContributionsMinor,
                sharedFundSpentMinor,
                sharedFundBalanceMinor,
                avgPerPersonMinor,
                highestCategory,
                highestCategoryMinor,
                topContributor,
                topContributorMinor,
                categoryTotals,
                ledger,
                suggestedTransfers
            };
        }

        /**
         * Greedy Creditor-Debtor Matching Algorithm (Minimizes number of transfers).
         * Handles unspent Shared Pool cash seamlessly:
         * - If Shared Pool has +2,000 BDT cash remaining, the Pool acts as a payer node returning unspent cash to net creditors!
         * - If Shared Pool was overdrawn (-500 BDT), debtors replenish the pool or creditors directly.
         */
        function computeOptimizedTransfers(ledger, sharedFundBalanceMinor) {
            const debtors = [];  // owe money (balance < 0)
            const creditors = []; // should receive money (balance > 0)

            Object.values(ledger).forEach(entry => {
                if (entry.remainingBalanceMinor < 0) {
                    debtors.push({
                        id: entry.member.id,
                        name: entry.member.name,
                        isPool: false,
                        amountMinor: Math.abs(entry.remainingBalanceMinor)
                    });
                } else if (entry.remainingBalanceMinor > 0) {
                    creditors.push({
                        id: entry.member.id,
                        name: entry.member.name,
                        isPool: false,
                        amountMinor: entry.remainingBalanceMinor
                    });
                }
            });

            // Account for unspent or overdrawn Shared Pool cash so total debtors === total creditors
            if (sharedFundBalanceMinor > 0) {
                debtors.push({
                    id: SHARED_FUND_ID,
                    name: 'Shared Tour Fund (Unspent Pool Cash)',
                    isPool: true,
                    amountMinor: sharedFundBalanceMinor
                });
            } else if (sharedFundBalanceMinor < 0) {
                creditors.push({
                    id: SHARED_FUND_ID,
                    name: 'Shared Tour Fund (Pool Overdraft)',
                    isPool: true,
                    amountMinor: Math.abs(sharedFundBalanceMinor)
                });
            }

            const transfers = [];
            while (debtors.length > 0 && creditors.length > 0) {
                debtors.sort((a, b) => b.amountMinor - a.amountMinor);
                creditors.sort((a, b) => b.amountMinor - a.amountMinor);

                const debtor = debtors[0];
                const creditor = creditors[0];
                const transferMinor = Math.min(debtor.amountMinor, creditor.amountMinor);

                if (transferMinor > 0) {
                    transfers.push({
                        fromId: debtor.id,
                        fromName: debtor.name,
                        fromIsPool: debtor.isPool,
                        toId: creditor.id,
                        toName: creditor.name,
                        toIsPool: creditor.isPool,
                        amountMinor: transferMinor
                    });
                }

                debtor.amountMinor -= transferMinor;
                creditor.amountMinor -= transferMinor;

                if (debtor.amountMinor === 0) debtors.shift();
                if (creditor.amountMinor === 0) creditors.shift();
            }

            return transfers;
        }

        /**
         * Exact Integer Allocation Helper (Distributes remainder cents fairly so sum === totalMinor)
         */
        function allocateEqualShares(totalMinor, memberIds) {
            const n = memberIds.length;
            if (n === 0) return [];
            const base = Math.floor(totalMinor / n);
            const remainder = totalMinor % n;
            return memberIds.map((memberId, idx) => ({
                memberId,
                shareMinor: base + (idx < remainder ? 1 : 0)
            }));
        }

        function allocateWeightedShares(totalMinor, weightedItems) {
            // weightedItems: [{ memberId, weight }]
            const totalWeight = weightedItems.reduce((sum, item) => sum + item.weight, 0);
            if (totalWeight <= 0) return [];
            let allocatedSum = 0;
            const results = weightedItems.map(item => {
                const exact = (totalMinor * item.weight) / totalWeight;
                const floored = Math.floor(exact);
                allocatedSum += floored;
                return {
                    memberId: item.memberId,
                    shareMinor: floored,
                    fraction: exact - floored
                };
            });
            let remainder = totalMinor - allocatedSum;
            // Distribute leftover minor units to largest fractional parts
            const sortedByFraction = [...results].sort((a, b) => b.fraction - a.fraction);
            for (let i = 0; i < remainder; i++) {
                sortedByFraction[i % sortedByFraction.length].shareMinor += 1;
            }
            return results.map(({ memberId, shareMinor }) => ({ memberId, shareMinor }));
        }

        function renderActiveView() {
            destroyActiveCharts();
            const tour = getActiveTour();
            const container = document.getElementById('main-content');

            if (!tour && activeTab !== 'settings') {
                renderBlankOnboarding(container);
                return;
            }

            if (activeTab === 'settings') {
                renderSettingsView(container, tour, tour ? calculateTourFinancials(tour) : null);
                return;
            }

            const fin = calculateTourFinancials(tour);

            switch (activeTab) {
                case 'dashboard':
                    renderDashboardView(container, tour, fin);
                    break;
                case 'members':
                    renderMembersView(container, tour, fin);
                    break;
                case 'expenses':
                    renderExpensesView(container, tour, fin);
                    break;
                case 'contributions':
                    renderContributionsView(container, tour, fin);
                    break;
                case 'settlements':
                    renderSettlementsView(container, tour, fin);
                    break;
                case 'reports':
                    renderReportsView(container, tour, fin);
                    break;

        function initDashboardCharts(tour, fin) {
            if (typeof Chart === 'undefined') return;
            const isDark = appState.settings.theme === 'dark';
            const textColor = isDark ? '#94a3b8' : '#475569';
            const gridColor = isDark ? 'rgba(148,163,184,0.1)' : 'rgba(148,163,184,0.2)';

            const catCanvas = document.getElementById('chart-category');
            if (catCanvas && tour.expenses.length > 0) {
                const labels = Object.keys(fin.categoryTotals);
                const values = labels.map(k => fromMinorUnits(fin.categoryTotals[k], tour.currency));
                const palette = ['#0d9488', '#0284c7', '#6366f1', '#f59e0b', '#ec4899', '#10b981', '#8b5cf6', '#64748b'];

                activeCharts.category = new Chart(catCanvas, {
                    type: 'doughnut',
                    data: {
                        labels,
                        datasets: [{
                            data: values,
                            backgroundColor: labels.map((_, i) => palette[i % palette.length]),
                            borderWidth: isDark ? 2 : 1,
                            borderColor: isDark ? '#0f172a' : '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '64%',
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: { color: textColor, boxWidth: 11, font: { size: 11, family: 'Inter' } }
                            }
                        }
                    }
                });
            }

            const memCanvas = document.getElementById('chart-members');
            if (memCanvas && tour.members.length > 0) {
                const memLabels = tour.members.map(m => m.nickname || m.name.split(' ')[0]);
                const creditsData = tour.members.map(m => fromMinorUnits(fin.ledger[m.id]?.eligibleCreditMinor || 0, tour.currency));
                const shareData = tour.members.map(m => fromMinorUnits(fin.ledger[m.id]?.expenseShareMinor || 0, tour.currency));

                activeCharts.members = new Chart(memCanvas, {
                    type: 'bar',
                    data: {
                        labels: memLabels,
                        datasets: [
                            {
                                label: 'Paid + Pool Deposit',
                                data: creditsData,
                                backgroundColor: '#0d9488',
                                borderRadius: 4
                            },
                            {
                                label: 'Expense Share',
                                data: shareData,
                                backgroundColor: isDark ? '#475569' : '#94a3b8',
                                borderRadius: 4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { ticks: { color: textColor, font: { size: 11 } }, grid: { display: false } },
                            y: { ticks: { color: textColor, font: { size: 11 } }, grid: { color: gridColor } }
                        },
                        plugins: {
                            legend: {
                                labels: { color: textColor, boxWidth: 11, font: { size: 11, family: 'Inter' } }
                            }
                        }
                    }
                });
            }
        }

                                <span>Share</span>
                              </button>
                              <button type="button" onclick="openMemberLedgerModal('${esc(m.id)}')" title="View Detailed Ledger" class="p-1.5 rounded-lg text-slate-500 hover:text-brand-600 hover:bg-slate-100 dark:hover:bg-slate-800">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                              </button>
                              <button type="button" onclick="openMemberModal('${esc(m.id)}')" title="Edit Member" class="p-1.5 rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>

        /* ==========================================================================
           10. VIEW 3: EXPENSES MANAGEMENT (Filters, Sort, Split Types, Undo)
           ========================================================================== */
        function getAllCategories() {
            return [...DEFAULT_CATEGORIES, ...(appState.settings.customCategories || [])];
        }

        function renderExpensesView(container, tour, fin) {
            const cur = tour.currency;
            const categories = getAllCategories();

            // Apply search & filters
            let list = [...tour.expenses];
            if (expenseFilters.search.trim()) {
                const q = expenseFilters.search.toLowerCase();
                list = list.filter(e =>
                    e.title.toLowerCase().includes(q) ||
                    (e.description && e.description.toLowerCase().includes(q)) ||
                    (e.notes && e.notes.toLowerCase().includes(q))
                );
            }
            if (expenseFilters.memberId !== 'ALL') {
                list = list.filter(e =>
                    e.paidBy === expenseFilters.memberId ||
                    (e.allocations || []).some(a => a.memberId === expenseFilters.memberId && a.shareMinor > 0)
                );
            }
            if (expenseFilters.category !== 'ALL') {
                list = list.filter(e => e.category === expenseFilters.category);
            }
            if (expenseFilters.date) {
                list = list.filter(e => e.dateTime && e.dateTime.startsWith(expenseFilters.date));
            }

            // Apply sorting
            list.sort((a, b) => {
                if (expenseFilters.sortBy === 'date_asc') return new Date(a.dateTime) - new Date(b.dateTime);
                if (expenseFilters.sortBy === 'amount_desc') return b.amountMinor - a.amountMinor;
                if (expenseFilters.sortBy === 'amount_asc') return a.amountMinor - b.amountMinor;
                return new Date(b.dateTime) - new Date(a.dateTime);
            });

            const filteredSumMinor = list.reduce((sum, e) => sum + e.amountMinor, 0);

            container.innerHTML = `
        <div class="space-y-5">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div>
              <h1 class="text-xl font-bold text-slate-900 dark:text-white">Tour Expenses</h1>
              <p class="text-xs text-slate-500 dark:text-slate-400">
                Showing ${list.length} of ${tour.expenses.length} expenses · Filtered Total: <span class="font-mono font-semibold text-slate-800 dark:text-slate-200">${formatMoney(filteredSumMinor, cur)}</span>
              </p>
            </div>
            <button type="button" onclick="openExpenseModal()" class="inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs sm:text-sm font-medium transition-colors shadow-sm">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              <span>Record Expense</span>
            </button>
          </div>

          <!-- Filter & Search Bar -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-3.5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5">
            <input type="search" value="${esc(expenseFilters.search)}" oninput="expenseFilters.search = this.value; renderActiveView();"
              placeholder="Search title or notes..."
              class="text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:border-brand-500" />

            <select onchange="expenseFilters.memberId = this.value; renderActiveView();" class="text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-2">
              <option value="ALL" ${expenseFilters.memberId === 'ALL' ? 'selected' : ''}>All Payers & Participants</option>
              <option value="${SHARED_FUND_ID}" ${expenseFilters.memberId === SHARED_FUND_ID ? 'selected' : ''}>Paid from Shared Pool</option>
              ${tour.members.map(m => `<option value="${esc(m.id)}" ${expenseFilters.memberId === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}
            </select>

            <select onchange="expenseFilters.category = this.value; renderActiveView();" class="text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-2">
              <option value="ALL" ${expenseFilters.category === 'ALL' ? 'selected' : ''}>All Categories</option>
              ${categories.map(c => `<option value="${esc(c)}" ${expenseFilters.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
            </select>

            <input type="date" value="${esc(expenseFilters.date)}" onchange="expenseFilters.date = this.value; renderActiveView();"
              class="text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-2" />

            <select onchange="expenseFilters.sortBy = this.value; renderActiveView();" class="text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-2">
              <option value="date_desc" ${expenseFilters.sortBy === 'date_desc' ? 'selected' : ''}>Newest First</option>
              <option value="date_asc" ${expenseFilters.sortBy === 'date_asc' ? 'selected' : ''}>Oldest First</option>
              <option value="amount_desc" ${expenseFilters.sortBy === 'amount_desc' ? 'selected' : ''}>Highest Amount</option>
              <option value="amount_asc" ${expenseFilters.sortBy === 'amount_asc' ? 'selected' : ''}>Lowest Amount</option>
            </select>
          </div>

          <!-- Expenses List -->
          ${list.length > 0 ? `
            <div class="space-y-2.5">
              ${list.map(exp => {
                const isPoolPaid = exp.paidBy === SHARED_FUND_ID;
                const payerName = isPoolPaid
                    ? 'Shared Tour Fund'
                    : (tour.members.find(m => m.id === exp.paidBy)?.name || 'Unknown');
                const participantCount = (exp.allocations || []).filter(a => a.shareMinor > 0).length;

                return `
                  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 hover:border-slate-300 dark:hover:border-slate-700 transition-colors">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div class="space-y-1 min-w-0">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="px-2 py-0.5 rounded text-[11px] font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                            ${esc(exp.category)}
                          </span>
                          <span class="px-2 py-0.5 rounded text-[11px] font-medium ${isPoolPaid
                        ? 'bg-brand-50 dark:bg-brand-950 text-brand-700 dark:text-brand-300'
                        : 'bg-sky-50 dark:bg-sky-950 text-sky-700 dark:text-sky-300'
                    }">
                            Paid by ${esc(payerName)}
                          </span>
                          <span class="text-[11px] text-slate-400">${formatDateTimeDisplay(exp.dateTime)}</span>
                          ${exp.receiptDataUrl ? '<span class="text-[11px] text-amber-600 dark:text-amber-400 font-medium">📎 Receipt</span>' : ''}
                        </div>
                        <button type="button" onclick="openExpenseDetailsModal('${esc(exp.id)}')" class="text-left text-sm sm:text-base font-semibold text-slate-900 dark:text-white hover:text-brand-600 dark:hover:text-brand-400 block truncate">
                          ${esc(exp.title)}
                        </button>
                        <div class="text-xs text-slate-500 dark:text-slate-400">
                          Split (${esc(exp.splitType)}) among <span class="font-medium text-slate-700 dark:text-slate-300">${participantCount} ${participantCount === 1 ? 'person' : 'people'}</span>
                          ${exp.description ? ` · ${esc(exp.description)}` : ''}
                        </div>
                      </div>

                      <div class="flex sm:flex-col items-center sm:items-end justify-between gap-2 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100 dark:border-slate-800">
                        <div class="text-base sm:text-lg font-bold font-mono tabular-nums text-slate-900 dark:text-white">
                          ${formatMoney(exp.amountMinor, cur)}
                        </div>
                        <div class="flex items-center gap-1">
                          <button type="button" onclick="openExpenseDetailsModal('${esc(exp.id)}')" title="View Details" class="p-1.5 rounded-lg text-slate-500 hover:text-brand-600 hover:bg-slate-100 dark:hover:bg-slate-800">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                          </button>
                          <button type="button" onclick="duplicateExpense('${esc(exp.id)}')" title="Duplicate Expense" class="p-1.5 rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                          </button>
                          <button type="button" onclick="openExpenseModal('${esc(exp.id)}')" title="Edit Expense" class="p-1.5 rounded-lg text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                          </button>
                          <button type="button" onclick="deleteExpense('${esc(exp.id)}')" title="Delete Expense" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/50">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                `;
            }).join('')}
            </div>
          ` : `
            <div class="bg-white dark:bg-slate-900 border border-dashed border-slate-300 dark:border-slate-700 rounded-xl p-10 text-center">
              <p class="text-sm font-medium text-slate-700 dark:text-slate-200">No matching expenses</p>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Record a new tour expense or clear active search filters.</p>
            </div>
          `}
        </div>
      `;
        }

        /* ==========================================================================
           11. VIEW 4: CONTRIBUTIONS (SHARED TOUR POOL)
           ========================================================================== */
        function renderContributionsView(container, tour, fin) {
            const cur = tour.currency;
            const sortedContribs = [...tour.contributions].sort((a, b) => new Date(b.date) - new Date(a.date));

            container.innerHTML = `
        <div class="space-y-5">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div>
              <h1 class="text-xl font-bold text-slate-900 dark:text-white">Shared Pool Contributions</h1>
              <p class="text-xs text-slate-500 dark:text-slate-400">Track money deposited into the central tour fund before or during the trip.</p>
            </div>
            <button type="button" onclick="openContributionModal()" class="inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs sm:text-sm font-medium transition-colors shadow-sm">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>

            <svg class="w-5 h-5 text-brand-600 dark:text-brand-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            <div>
              <div class="font-semibold">Zero Double-Counting Accounting Rule</div>
              <p class="mt-0.5 leading-relaxed opacity-90">
                Deposits here credit the member's contribution balance and increase the <strong>Shared Tour Fund</strong>. When an expense is paid using <em>"Shared Tour Fund"</em>, it draws down this pool without crediting an individual payer twice, while each participant's share is deducted accurately.
              </p>
            </div>
          </div>

          <!-- Pool Summary Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4">
              <div class="text-xs text-slate-500 dark:text-slate-400">Total Deposited into Pool</div>
              <div class="mt-1 text-xl font-bold font-mono tabular-nums text-slate-900 dark:text-white">${formatMoney(fin.totalContributionsMinor, cur)}</div>

            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4">
              <div class="text-xs text-slate-500 dark:text-slate-400">Spent from Shared Pool</div>
              <div class="mt-1 text-xl font-bold font-mono tabular-nums text-slate-900 dark:text-white">${formatMoney(fin.sharedFundSpentMinor, cur)}</div>
            </div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4">
              <div class="text-xs text-slate-500 dark:text-slate-400">Remaining Pool Cash</div>
              <div class="mt-1 text-xl font-bold font-mono tabular-nums ${fin.sharedFundBalanceMinor < 0 ? 'text-rose-600 dark:text-rose-400' : 'text-brand-600 dark:text-brand-400'}">
                ${formatMoney(fin.sharedFundBalanceMinor, cur)}
              </div>
            </div>
          </div>

          <!-- Contributions Table -->
          ${sortedContribs.length > 0 ? `
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden shadow-sm">
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="border-b border-slate-200 dark:border-slate-800 bg-slate-50/80 dark:bg-slate-800/50 text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                      <th class="py-3 px-4">Member</th>

                        <tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40">

                            ${formatMoney(c.amountMinor, cur)}

        /* ==========================================================================

        function openModal(title, bodyHtml, footerHtml = '') {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-footer').innerHTML = footerHtml;
            document.getElementById('modal-backdrop').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
            document.getElementById('modal-body').innerHTML = '';
            document.getElementById('modal-footer').innerHTML = '';
        }

        /* --- TOUR MODAL (Create / Edit) --- */
        function openTourModal(editTourId = null) {

            const budgetDisplay = existing && existing.budgetMinor ? fromMinorUnits(existing.budgetMinor, existing.currency) : '';

            const body = `
        <form id="tour-form" onsubmit="saveTourForm(event, '${editTourId || ''}')" class="space-y-3.5">
          <div>
            <label class="block text-xs font-medium mb-1">Tour Name *</label>

                ${allCurrencies.map(c => `<option value="${esc(c.code)}" ${(existing?.currency || 'BDT') === c.code ? 'selected' : ''}>${esc(c.code)} (${esc(c.symbol)})</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium mb-1">Optional Budget</label>
              <input type="number" step="any" min="0" name="budget" value="${budgetDisplay}" placeholder="0.00"
                class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm font-mono" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium mb-1">Description</label>
            <textarea name="description" rows="2" placeholder="Optional trip notes..."
              class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm">${esc(existing?.description || '')}</textarea>
          </div>
        </form>
      `;

            const footer = `
        <button type="button" onclick="closeModal()" class="px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-medium">Cancel</button>
        <button type="submit" form="tour-form" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium">
          ${existing ? 'Save Changes' : 'Create Tour'}
        </button>
      `;

            openModal(existing ? 'Edit Tour' : 'Create New Tour', body, footer);
        }

        function saveTourForm(e, editTourId) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const name = fd.get('name').trim();
            const destination = fd.get('destination').trim();
            const startDate = fd.get('startDate');
            const endDate = fd.get('endDate');
            const currency = fd.get('currency');
            const budgetMinor = toMinorUnits(fd.get('budget'), currency);
            const description = fd.get('description').trim();

            if (!name) return;

            if (editTourId) {
                const tour = appState.tours.find(t => t.id === editTourId);
                if (tour) {
                    Object.assign(tour, { name, destination, startDate, endDate, currency, budgetMinor, description });
                }
                showToast('Tour updated.');
            } else {
                const newTour = createEmptyTour(name, destination, currency, startDate, endDate, budgetMinor, description);
                appState.tours.push(newTour);
                appState.activeTourId = newTour.id;
                showToast(`Created "${name}". Add members next!`);
            }

            saveState();
            closeModal();
            renderTourSelectors();
            renderActiveView();
        }

        function toggleArchiveTour(tourId) {
            const tour = appState.tours.find(t => t.id === tourId);
            if (!tour) return;
            tour.archived = !tour.archived;
            saveState();
            renderTourSelectors();
            renderActiveView();
            showToast(tour.archived ? 'Tour archived.' : 'Tour restored from archive.');
        }

        function confirmDeleteTour(tourId) {
            const tour = appState.tours.find(t => t.id === tourId);
            if (!tour) return;
            openModal(
                'Delete Tour?',
                `<p class="text-slate-600 dark:text-slate-300">Are you sure you want to permanently delete <strong>${esc(tour.name)}</strong> along with all its ${tour.members.length} members and ${tour.expenses.length} expenses?</p>`,
                `<button type="button" onclick="closeModal()" class="px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-medium">Cancel</button>
         <button type="button" onclick="deleteTour('${esc(tourId)}')" class="px-4 py-2 rounded-lg bg-rose-600 text-white text-xs font-medium">Delete Permanently</button>`
            );
        }

        function deleteTour(tourId) {
            appState.tours = appState.tours.filter(t => t.id !== tourId);
            if (appState.activeTourId === tourId) {
                appState.activeTourId = appState.tours[0]?.id || null;
            }
            saveState();
            closeModal();
            renderTourSelectors();
            renderActiveView();
            showToast('Tour deleted.');
        }

        /* --- MEMBER MODAL & INDIVIDUAL LEDGER --- */
        function openMemberModal(editMemberId = null) {
            const tour = getActiveTour();
            const existing = editMemberId ? tour.members.find(m => m.id === editMemberId) : null;
            const defaultColor = existing?.color || AVATAR_COLORS[tour.members.length % AVATAR_COLORS.length];

            <input type="text" name="name" required value="${esc(existing?.name || '')}" placeholder="e.g., Tanvir Ahmed"

              ${AVATAR_COLORS.map(col => `
                <label class="cursor-pointer">
                  <input type="radio" name="color" value="${col}" ${defaultColor === col ? 'checked' : ''} class="sr-only peer" />
                  <span class="w-7 h-7 rounded-full block peer-checked:ring-2 peer-checked:ring-offset-2 peer-checked:ring-slate-900 dark:peer-checked:ring-white" style="background-color: ${col}"></span>

          </div>
        </form>
      `;

            const footer = `
        <button type="button" onclick="closeModal()" class="px-3.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-medium">Cancel</button>
        <button type="submit" form="member-form" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium">
          ${existing ? 'Save Changes' : 'Add Member'}
        </button>
      `;

            openModal(existing ? 'Edit Member' : 'Add Tour Member', body, footer);
        }

        function saveMemberForm(e, editMemberId) {
            e.preventDefault();
            const tour = getActiveTour();
            if (!tour) {
                showToast('Please create or select a tour first.', 'warning');
                return;
            }

            const formEl = e.target;
            const nameInput = formEl.querySelector('[name="name"]');
            const nicknameInput = formEl.querySelector('[name="nickname"]');
            const phoneInput = formEl.querySelector('[name="phone"]');
            const colorInput = formEl.querySelector('[name="color"]:checked');
            const notesInput = formEl.querySelector('[name="notes"]');

            const name = (nameInput?.value || '').trim();
            const nickname = (nicknameInput?.value || '').trim();
            const phone = (phoneInput?.value || '').trim();
            const color = colorInput?.value || AVATAR_COLORS[tour.members.length % AVATAR_COLORS.length];
            const notes = (notesInput?.value || '').trim();

            if (!name) {
                showToast('Please enter the member\'s full name.', 'warning');
                return;
            }

            if (!Array.isArray(tour.members)) {
                tour.members = [];
            }

            if (editMemberId) {
                const mem = tour.members.find(m => m.id === editMemberId);
                if (mem) Object.assign(mem, { name, nickname, phone, color, notes });
                showToast('Member updated.');
            } else {
                tour.members.push({ id: uid('mem'), name, nickname, phone, color, notes });
                showToast(`Added ${name}.`);
            }

            saveState();
            closeModal();
            renderActiveView();
        }

        function attemptDeleteMember(memberId) {
            const tour = getActiveTour();
            const mem = tour.members.find(m => m.id === memberId);
            if (!mem) return;

            const isLinked =
                tour.contributions.some(c => c.memberId === memberId) ||
                tour.expenses.some(e => e.paidBy === memberId || (e.allocations || []).some(a => a.memberId === memberId && a.shareMinor > 0)) ||
                tour.settlements.some(s => s.fromMemberId === memberId || s.toMemberId === memberId);

            if (isLinked) {
                openModal(
                    'Cannot Delete Member',
                    `<p class="text-slate-600 dark:text-slate-300"><strong>${esc(mem.name)}</strong> is linked to existing expenses, shared pool deposits, or settlements in this tour. Remove or reassign those transactions first to protect ledger integrity.</p>`,
                    `<button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg bg-slate-800 text-white text-xs font-medium">Understood</button>`
                );
                return;
            }

        /** Live interactive split calculation inside Expense Modal */
        function recalculateSplitPreview() {
            const tour = getActiveTour();
            const amountInput = document.getElementById('exp-amount-input');
            const splitTypeSel = document.getElementById('exp-split-type');
            if (!amountInput || !splitTypeSel) return;

            const totalMinor = toMinorUnits(amountInput.value, tour.currency);
            const splitType = splitTypeSel.value;
            const checks = Array.from(document.querySelectorAll('.split-member-check'));
            const customInputs = Array.from(document.querySelectorAll('.split-custom-input'));
            const banner = document.getElementById('split-validation-banner');
            const remLabel = document.getElementById('split-remaining-label');

            // Show or hide numeric inputs depending on splitType
            customInputs.forEach(inp => {
                const memId = inp.getAttribute('data-member-input');
                const chk = document.querySelector(`.split-member-check[data-member-id="${memId}"]`);
                if (splitType === 'equal') {
                    inp.classList.add('hidden');
                } else {
                    inp.classList.remove('hidden');
                    inp.disabled = !chk.checked;
                    if (splitType === 'percentage') inp.placeholder = '%';
                    else if (splitType === 'weighted') {
                        inp.placeholder = '1';
                        if (!inp.value && chk.checked) inp.value = '1';
                    } else inp.placeholder = '0.00';
                }
            });

            const activeIds = checks.filter(c => c.checked).map(c => c.getAttribute('data-member-id'));
            let allocations = [];

            if (splitType === 'equal') {
                allocations = allocateEqualShares(totalMinor, activeIds);
                banner.className = 'text-[11px] font-medium text-emerald-600 dark:text-emerald-400 flex justify-between pt-1 border-t border-slate-200/70 dark:border-slate-700/70';
                remLabel.textContent = `${activeIds.length} participants`;
            } else if (splitType === 'custom') {
                let sumMinor = 0;
                allocations = activeIds.map(id => {
                    const val = document.querySelector(`[data-member-input="${id}"]`)?.value || 0;
                    const mMinor = toMinorUnits(val, tour.currency);
                    sumMinor += mMinor;
                    return { memberId: id, shareMinor: mMinor };
                });
                const diff = totalMinor - sumMinor;
                if (diff === 0 && totalMinor > 0) {
                    banner.className = 'text-[11px] font-medium text-emerald-600 dark:text-emerald-400 flex justify-between pt-1 border-t border-slate-200/70 dark:border-slate-700/70';
                    remLabel.textContent = 'Exact match ✓';
                } else {
                    banner.className = 'text-[11px] font-medium text-amber-600 dark:text-amber-400 flex justify-between pt-1 border-t border-slate-200/70 dark:border-slate-700/70';
                    remLabel.textContent = `Remaining: ${formatMoney(diff, tour.currency)}`;
                }
            } else if (splitType === 'percentage') {
                let pctSum = 0;
                const weights = activeIds.map(id => {
                    const pct = parseFloat(document.querySelector(`[data-member-input="${id}"]`)?.value || 0) || 0;
                    pctSum += pct;
                    return { memberId: id, weight: pct };
                });
                allocations = Math.abs(pctSum - 100) < 0.01 ? allocateWeightedShares(totalMinor, weights) : [];
                if (Math.abs(pctSum - 100) < 0.01) {
                    banner.className = 'text-[11px] font-medium text-emerald-600 dark:text-emerald-400 flex justify-between pt-1 border-t border-slate-200/70 dark:border-slate-700/70';
                    remLabel.textContent = '100% allocated ✓';
                } else {
                    banner.className = 'text-[11px] font-medium text-amber-600 dark:text-amber-400 flex justify-between pt-1 border-t border-slate-200/70 dark:border-slate-700/70';
                    remLabel.textContent = `Total: ${pctSum.toFixed(1)}% (must be 100%)`;
                }
            } else if (splitType === 'weighted') {
                const weights = activeIds.map(id => {
                    const w = parseFloat(document.querySelector(`[data-member-input="${id}"]`)?.value || 1) || 0;
                    return { memberId: id, weight: w };
                });
                allocations = allocateWeightedShares(totalMinor, weights);
                banner.className = 'text-[11px] font-medium text-emerald-600 dark:text-emerald-400 flex justify-between pt-1 border-t border-slate-200/70 dark:border-slate-700/70';
                remLabel.textContent = 'Proportional shares';
            }

            // Update per-member preview amounts
            tour.members.forEach(m => {
                const prevEl = document.querySelector(`[data-member-preview="${m.id}"]`);
                const found = allocations.find(a => a.memberId === m.id);
                if (prevEl) prevEl.textContent = formatMoney(found ? found.shareMinor : 0, tour.currency);
            });

            return allocations;
        }

        function handleReceiptUpload(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    // Compress image to max 800px width to preserve LocalStorage space
                    const canvas = document.createElement('canvas');
                    const maxW = 800;
                    const scale = img.width > maxW ? maxW / img.width : 1;
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    tempReceiptDataUrl = canvas.toDataURL('image/jpeg', 0.65);
                    document.getElementById('receipt-preview-box')?.classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function saveExpenseForm(e, editExpenseId) {
            e.preventDefault();
            const tour = getActiveTour();
            const fd = new FormData(e.target);
            const title = fd.get('title').trim();
            const amountMinor = toMinorUnits(fd.get('amount'), tour.currency);
            const category = fd.get('category');
            const paidBy = fd.get('paidBy');
            const dateTime = fd.get('dateTime') || nowDateTimeLocal();
            const splitType = fd.get('splitType');
            const description = fd.get('description').trim();

            if (!title || amountMinor <= 0) {
                showToast('Please enter a valid title and positive amount.', 'warning');
                return;
            }

            const allocations = recalculateSplitPreview();
            const allocatedSum = allocations.reduce((s, a) => s + a.shareMinor, 0);

            if (allocations.length === 0 || allocatedSum !== amountMinor) {
                showToast('Split shares must equal the exact total expense amount.', 'warning');
                return;
            }

            const record = {
                id: editExpenseId || uid('exp'),
                title,
                amountMinor,
                category,
                dateTime,
                paidBy,
                splitType,
                allocations,
                description,
                notes: '',
                receiptDataUrl: tempReceiptDataUrl
            };

            if (editExpenseId) {
                const idx = tour.expenses.findIndex(x => x.id === editExpenseId);
                if (idx !== -1) tour.expenses[idx] = record;
                showToast('Expense updated.');
            } else {
                tour.expenses.push(record);
                showToast('Expense recorded.');
            }

            saveState();
            closeModal();
            renderActiveView();
        }

        function duplicateExpense(expenseId) {
            const tour = getActiveTour();
            const orig = tour.expenses.find(e => e.id === expenseId);
            if (!orig) return;
            const copy = JSON.parse(JSON.stringify(orig));
            copy.id = uid('exp');
            copy.title = `${orig.title} (Copy)`;
            copy.dateTime = nowDateTimeLocal();
            tour.expenses.push(copy);
            saveState();
            renderActiveView();
            showToast('Expense duplicated.');
        }

        function deleteExpense(expenseId) {
            const tour = getActiveTour();
            const idx = tour.expenses.findIndex(e => e.id === expenseId);
            if (idx === -1) return;
            recentlyDeletedExpense = { tourId: tour.id, expense: tour.expenses[idx] };
            tour.expenses.splice(idx, 1);
            saveState();
            renderActiveView();
            showToast('Expense deleted.', 'info', {
                label: 'Undo',
                callback: () => {
                    if (!recentlyDeletedExpense) return;
                    const targetTour = appState.tours.find(t => t.id === recentlyDeletedExpense.tourId);
                    if (targetTour) {
                        targetTour.expenses.push(recentlyDeletedExpense.expense);
                        recentlyDeletedExpense = null;
                        saveState();
                        renderActiveView();
                        showToast('Expense restored.');
                    }
                }
            });
        }

        function buildSafeFilename(tourName, suffix, ext) {
            const clean = (tourName || 'Tour').replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_|_$/g, '');
            return `TourTally_${clean}_${todayISO()}_${suffix}.${ext}`;
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function exportBackupJSON(singleTourOnly = false) {
            const tour = getActiveTour();
            const payload = {
                appName: 'TourTally',
                schemaVersion: SCHEMA_VERSION,
                exportedAt: new Date().toISOString(),
                backupType: singleTourOnly ? 'single_tour' : 'full_app',
                settings: appState.settings,
                tours: singleTourOnly ? [tour] : appState.tours
            };

            appState.settings.lastBackupAt = new Date().toISOString();
            saveState(appState, true);

            const filename = singleTourOnly
                ? buildSafeFilename(tour.name, 'Backup', 'json')
                : `TourTally_Full_Backup_${todayISO()}.json`;

            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            triggerDownload(blob, filename);
            renderActiveView();
            showToast('JSON backup downloaded.');
        }

        let pendingImportedBackup = null;

        function handleBackupFileSelect(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data || data.appName !== 'TourTally' || !Array.isArray(data.tours) || data.tours.length === 0) {
                        throw new Error('Invalid TourTally JSON backup file.');
                    }
                    pendingImportedBackup = data;
                    const totalMembers = data.tours.reduce((s, t) => s + (t.members?.length || 0), 0);
                    const totalExpenses = data.tours.reduce((s, t) => s + (t.expenses?.length || 0), 0);

                    openModal(
                        'Preview & Restore JSON Backup',
                        `<div class="space-y-3 text-xs">
              <div class="p-3 rounded-lg bg-slate-50 dark:bg-slate-800 space-y-1">
                <div><strong>Exported At:</strong> ${formatDateTimeDisplay(data.exportedAt)}</div>
                <div><strong>Tours Included:</strong> ${data.tours.length} (${data.tours.map(t => esc(t.name)).join(', ')})</div>
                <div><strong>Total Members:</strong> ${totalMembers} · <strong>Total Expenses:</strong> ${totalExpenses}</div>
              </div>
              <p class="text-slate-600 dark:text-slate-300">Choose how to import this backup:</p>
            </div>`,
                        `<button type="button" onclick="closeModal()" class="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-xs">Cancel</button>
             <button type="button" onclick="confirmImportBackup('merge')" class="px-3.5 py-2 rounded-lg bg-slate-800 dark:bg-slate-700 text-white text-xs font-medium">Merge Tours</button>
             <button type="button" onclick="confirmImportBackup('replace')" class="px-3.5 py-2 rounded-lg bg-brand-600 text-white text-xs font-medium">Replace Existing</button>`
                    );
                } catch (err) {
                    showToast(err.message || 'Could not read backup file.', 'error');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function confirmImportBackup(mode) {
            if (!pendingImportedBackup) return;
            if (mode === 'replace') {
                appState.tours = pendingImportedBackup.tours;
                appState.activeTourId = appState.tours[0].id;
            } else {
                // Merge tours (assign fresh ID if collision exists)
                pendingImportedBackup.tours.forEach(impTour => {
                    const exists = appState.tours.some(t => t.id === impTour.id);
                    if (exists) {
                        impTour.id = uid('tour');
                        impTour.name = `${impTour.name} (Imported)`;
                    }
                    appState.tours.push(impTour);
                });
                appState.activeTourId = pendingImportedBackup.tours[0].id;
            }

            pendingImportedBackup = null;
            saveState();
            closeModal();
            renderTourSelectors();
            renderActiveView();
            showToast(`Backup ${mode === 'replace' ? 'restored' : 'merged'} successfully.`);
        }

        function exportTourXLSX() {
            if (typeof XLSX === 'undefined') {

            }
            const tour = getActiveTour();
            const fin = calculateTourFinancials(tour);
            const cur = tour.currency;
            const wb = XLSX.utils.book_new();

            // Sheet 1: Tour Summary
            const summaryRows = [
                ['TourTally Financial Report'],
                ['Tour Name', tour.name],
                ['Destination', tour.destination],
                ['Dates', `${tour.startDate} to ${tour.endDate}`],
                ['Currency', cur],
                ['Total Expenses', fromMinorUnits(fin.totalExpensesMinor, cur)],
                ['Total Pool Contributions', fromMinorUnits(fin.totalContributionsMinor, cur)],
                ['Spent from Shared Pool', fromMinorUnits(fin.sharedFundSpentMinor, cur)],
                ['Remaining Shared Pool', fromMinorUnits(fin.sharedFundBalanceMinor, cur)]
            ];
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Tour Summary');

            // Sheet 2: Members
            const memberRows = [
                ['Member Name', 'Nickname', 'Phone', 'Pool Deposit', 'Direct Paid', 'Expense Share', 'Settled Paid', 'Settled Received', 'Remaining Balance'],
                ...tour.members.map(m => {
                    const e = fin.ledger[m.id];
                    return [
                        m.name,
                        m.nickname || '',
                        m.phone || '',
                        fromMinorUnits(e?.contributedMinor || 0, cur),
                        fromMinorUnits(e?.directPaidMinor || 0, cur),
                        fromMinorUnits(e?.expenseShareMinor || 0, cur),
                        fromMinorUnits(e?.settlementsPaidMinor || 0, cur),
                        fromMinorUnits(e?.settlementsReceivedMinor || 0, cur),
                        fromMinorUnits(e?.remainingBalanceMinor || 0, cur)
                    ];
                })
            ];
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(memberRows), 'Members');

            // Sheet 3: Expenses
            const expenseRows = [
                ['Date & Time', 'Title', 'Category', 'Paid By', 'Split Type', 'Amount', 'Description'],
                ...tour.expenses.map(exp => {
                    const payer = exp.paidBy === SHARED_FUND_ID ? 'Shared Tour Fund' : (tour.members.find(m => m.id === exp.paidBy)?.name || 'Unknown');
                    return [
                        exp.dateTime,
                        exp.title,
                        exp.category,
                        payer,
                        exp.splitType,
                        fromMinorUnits(exp.amountMinor, cur),
                        exp.description || ''
                    ];
                })
            ];
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(expenseRows), 'Expenses');

            // Sheet 4: Contributions
            const contribRows = [
                ['Date', 'Member', 'Method', 'Amount', 'Description'],
                ...tour.contributions.map(c => [
                    c.date,
                    tour.members.find(m => m.id === c.memberId)?.name || 'Unknown',
                    c.method || 'Cash',
                    fromMinorUnits(c.amountMinor, cur),
                    c.description || ''
                ])
            ];
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(contribRows), 'Contributions');

            // Sheet 5: Settlements
            const settleRows = [
                ['Status', 'From', 'To', 'Amount', 'Date / Note'],
                ...fin.suggestedTransfers.map(tr => ['Pending', tr.fromName, tr.toName, fromMinorUnits(tr.amountMinor, cur), 'Suggested']),
                ...tour.settlements.map(s => [
                    'Completed',
                    tour.members.find(m => m.id === s.fromMemberId)?.name || 'Unknown',
                    tour.members.find(m => m.id === s.toMemberId)?.name || 'Unknown',
                    fromMinorUnits(s.amountMinor, cur),
                    `${s.date} ${s.note || ''}`
                ])
            ];
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(settleRows), 'Settlements');

            XLSX.writeFile(wb, buildSafeFilename(tour.name, 'Expenses', 'xlsx'));
            showToast('XLSX workbook exported.');
        }

        async function exportTourPNG() {
            const el = document.getElementById('printable-report-area');

            showToast('Generating PNG snapshot...');
            const canvas = await html2canvas(el, { scale: 2, backgroundColor: appState.settings.theme === 'dark' ? '#0f172a' : '#ffffff' });
            canvas.toBlob(blob => {
                if (blob) {
                    triggerDownload(blob, buildSafeFilename(getActiveTour().name, 'Report', 'png'));
                    showToast('PNG report downloaded.');
                }
            });
        }

        async function exportTourPDF() {
            const el = document.getElementById('printable-report-area');
            if (!el || typeof html2canvas === 'undefined' || !window.jspdf) return;
            showToast('Generating PDF report...');
            const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff' });
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pageWidth = pdf.internal.pageSize.getWidth();
            const imgHeight = (canvas.height * pageWidth) / canvas.width;
            pdf.addImage(imgData, 'PNG', 0, 0, pageWidth, imgHeight);
            pdf.save(buildSafeFilename(getActiveTour().name, 'Report', 'pdf'));
            showToast('PDF report downloaded.');

        function buildIndividualMemberReportText(tour, fin, memberId) {
            const entry = fin?.ledger?.[memberId];
            if (!entry) return '';
            const m = entry.member;
            const cur = tour.currency;
            const rem = entry.remainingBalanceMinor || 0;

            const positionLine = rem > 0
                ? `Status: Receives ${formatMoney(rem, cur)} (Net Excess / Credit)`
                : rem < 0
                    ? `Status: Owes ${formatMoney(Math.abs(rem), cur)} (Net Debt)`
                    : 'Status: Settled (0.00)';

            const relevantTransfers = (fin.suggestedTransfers || []).filter(
                tr => (!tr.fromIsPool && tr.fromId === memberId) || (!tr.toIsPool && tr.toId === memberId)
            );

            const lines = [
                `TourTally Individual Report — ${m.name}`,
                `Tour: ${tour.name} (${tour.destination || 'Trip'})`,
                positionLine,
                `• Shared Pool Deposited: ${formatMoney(entry.contributedMinor || 0, cur)}`,
                `• Direct Expenses Paid: ${formatMoney(entry.directPaidMinor || 0, cur)}`,
                `• Total Expense Share: ${formatMoney(entry.expenseShareMinor || 0, cur)}`,
                `• Net Remaining Balance: ${formatMoney(rem, cur, true)}`
            ];

            if (relevantTransfers.length > 0) {
                lines.push('Suggested Transfers:');
                relevantTransfers.forEach(tr => {
                    lines.push(`  - ${tr.fromName} → ${tr.toName}: ${formatMoney(tr.amountMinor, cur)}`);
                });
            }

            return lines.join('\n');
        }
