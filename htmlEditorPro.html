<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Editor Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Enable class-based dark mode
            theme: {
                extend: {
                    colors: {
                        monaco: {
                            light: '#ffffff',
                            dark: '#1e1e1e', // Matches vs-dark background
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overscroll-behavior: none; /* Prevent pull-to-refresh on mobile */
        }
        
        /* Light Mode Tab Styles (Default) */
        .tab-btn {
            background-color: #f1f3f4;
            color: #5f6368;
            border-top: 3px solid transparent;
            transition: all 0.2s ease-in-out;
        }
        .tab-btn:hover { background-color: #e8eaed; }
        .tab-btn.active { background-color: #ffffff; color: #202124; font-weight: 600; }
        
        /* Dark Mode Tab Styles */
        .dark .tab-btn {
            background-color: #2d2d2d;
            color: #a0a0a0;
        }
        .dark .tab-btn:hover { background-color: #383838; }
        .dark .tab-btn.active { background-color: #1e1e1e; color: #ffffff; }

        /* Active borders for specific tabs */
        .tab-btn.active[data-lang="html"] { border-top-color: #e44d26; }
        .tab-btn.active[data-lang="css"] { border-top-color: #264de4; }
        .tab-btn.active[data-lang="js"] { border-top-color: #f7df1e; }
        
        /* Colored squares for tabs */
        .color-square { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
        .sq-html { background-color: #e44d26; }
        .sq-css { background-color: #264de4; }
        .sq-js { background-color: #c68a35; }

        /* Action Button styling */
        .action-btn {
            background-color: #ffffff;
            border: 1px solid #dadce0;
            color: #3c4043;
            transition: background-color 0.15s;
        }
        .action-btn:hover { background-color: #f1f3f4; }
        
        /* Dark Mode Action Button */
        .dark .action-btn { background-color: #333333; border-color: #444444; color: #e8eaed; }
        .dark .action-btn:hover { background-color: #444444; }

        /* Editor Container */
        #editor-container {
            height: 100%;
            width: 100%;
        }

        /* Responsive Main Height */
        .workspace { height: calc(100vh - 60px); }
    </style>
</head>

<body class="flex flex-col h-screen overflow-hidden text-gray-800 dark:text-gray-200 bg-gray-50 dark:bg-gray-900 transition-colors duration-200">

    <!-- Header / Navbar -->
    <header class="h-[60px] bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 flex items-center justify-between shrink-0 transition-colors duration-200">
        <h1 class="text-lg md:text-xl font-bold text-gray-700 dark:text-gray-100 flex items-center gap-2">
            <i class="fa-solid fa-code text-blue-500"></i> <span class="hidden sm:inline">HTML Editor Pro</span><span class="sm:hidden">Editor Pro</span>
        </h1>
        
        <!-- Theme Toggle Button -->
        <button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 focus:outline-none transition-colors" aria-label="Toggle Dark Mode">
            <i class="fa-solid fa-moon dark:hidden text-lg"></i>
            <i class="fa-solid fa-sun hidden dark:inline-block text-lg"></i>
        </button>
    </header>

    <!-- Main Workspace (Editor + Preview) -->
    <main class="workspace flex flex-col md:flex-row w-full overflow-hidden">
        
        <!-- Left Side: Editor Section -->
        <section class="w-full md:w-1/2 h-1/2 md:h-full flex flex-col border-b md:border-b-0 md:border-r border-gray-300 dark:border-gray-700 bg-white dark:bg-monaco-dark shadow-sm z-10">
            
            <!-- Tabs -->
            <div class="flex overflow-x-auto whitespace-nowrap border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-[#252526] shrink-0 custom-scrollbar">
                <button class="tab-btn active px-4 md:px-6 py-2.5 md:py-3 text-xs md:text-sm flex items-center focus:outline-none flex-1 justify-center md:justify-start" data-lang="html">
                    <span class="color-square sq-html"></span> HTML
                </button>
                <button class="tab-btn px-4 md:px-6 py-2.5 md:py-3 text-xs md:text-sm flex items-center focus:outline-none flex-1 justify-center md:justify-start" data-lang="css">
                    <span class="color-square sq-css"></span> CSS
                </button>
                <button class="tab-btn px-4 md:px-6 py-2.5 md:py-3 text-xs md:text-sm flex items-center focus:outline-none flex-1 justify-center md:justify-start" data-lang="js">
                    <span class="color-square sq-js"></span> JS
                </button>
            </div>

            <!-- Monaco Editor Container -->
            <div class="flex-1 relative">
                <div id="editor-container" class="absolute inset-0"></div>
            </div>

            <!-- Action Buttons Bar -->
            <div class="shrink-0 h-[50px] border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-[#252526] flex items-center justify-end px-3 md:px-4 gap-2 md:gap-3 transition-colors">
                <button id="btn-insert-image" class="action-btn px-3 py-1.5 rounded text-xs md:text-sm font-medium flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-image"></i> <span class="hidden sm:inline">Image</span>
                </button>
                <input type="file" id="image-upload" accept="image/*" class="hidden">
                <button id="btn-download" class="action-btn px-3 py-1.5 rounded text-xs md:text-sm font-medium flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Download</span>
                </button>
                <button id="btn-reset" class="action-btn px-3 py-1.5 rounded text-xs md:text-sm font-medium flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-arrow-rotate-right"></i> <span class="hidden sm:inline">Reset</span>
                </button>
            </div>
        </section>

        <!-- Right Side: Live Preview -->
        <section class="w-full md:w-1/2 h-1/2 md:h-full bg-white dark:bg-gray-800 flex flex-col relative">
            <div class="absolute top-0 right-0 left-0 bg-gray-100/80 dark:bg-gray-900/80 backdrop-blur border-b border-gray-200 dark:border-gray-700 px-3 py-1.5 text-[10px] md:text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider z-10 pointer-events-none flex justify-between items-center">
                <span>Live Preview</span>
                <!-- Visual indicator that the preview background remains white -->
                <span class="normal-case tracking-normal opacity-70"><i class="fa-solid fa-desktop mr-1"></i> Preview always renders on white</span>
            </div>
            
            <!-- iframe background stays white regardless of theme to reflect accurate HTML rendering -->
            <iframe id="preview-frame" class="w-full h-full border-none bg-white pt-7" title="Live Preview" sandbox="allow-scripts allow-same-origin"></iframe>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
    
    <script>
        // 1. Theme Management
        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        // Check local storage or system preference
        function initTheme() {
            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlElement.classList.add('dark');
            } else {
                htmlElement.classList.remove('dark');
            }
        }
        initTheme();

        // Toggle Theme Event
        themeToggleBtn.addEventListener('click', function() {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('color-theme', isDark ? 'dark' : 'light');

            // Update Monaco theme on the fly
            if (editor) {
                monaco.editor.setTheme(isDark ? 'vs-dark' : 'vs');
            }
        });

        // 2. Define Initial/Default Code Values
        const defaultCode = {
            html: `<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Document</title>\n</head>\n<body>\n    \n</body>\n</html>`,
            css: ``,
            js: ``
        };

        // 3. Setup Monaco Editor Configuration
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs' }});

        // 4. Initialize Editor Variables
        let editor;
        let models = {};
        let currentLang = 'html';
        const previewFrame = document.getElementById('preview-frame');
        let updateTimeout;

        require(['vs/editor/editor.main'], function () {
            
            // Register custom HTML completion provider for Emmet-style tags
            monaco.languages.registerCompletionItemProvider('html', {
                provideCompletionItems: function(model, position) {
                    const word = model.getWordUntilPosition(position);
                    const range = {
                        startLineNumber: position.lineNumber,
                        endLineNumber: position.lineNumber,
                        startColumn: word.startColumn,
                        endColumn: word.endColumn
                    };

                    const textUntilPosition = model.getValueInRange({
                        startLineNumber: position.lineNumber,
                        startColumn: 1,
                        endLineNumber: position.lineNumber,
                        endColumn: word.startColumn
                    });
                    const hasOpenBracket = textUntilPosition.endsWith('<');

                    const tags = [
                        'html', 'head', 'body', 'title', 'div', 'span', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 
                        'p', 'a', 'ul', 'ol', 'li', 'table', 'tr', 'td', 'th', 'script', 'style', 'nav', 
                        'header', 'footer', 'main', 'button', 'form', 'input', 'label', 'section', 'article',
                        'img', 'br', 'hr', 'meta', 'link'
                    ];
                    
                    const suggestions = tags.map(tag => {
                        const isVoid = ['img', 'br', 'hr', 'input', 'meta', 'link'].includes(tag);
                        
                        let insertText = '';
                        if (isVoid) {
                            insertText = hasOpenBracket ? `${tag}>` : `<${tag}>`;
                        } else {
                            // $1 puts the cursor inside the tags after hitting enter
                            insertText = hasOpenBracket ? `${tag}>$1</${tag}>` : `<${tag}>$1</${tag}>`;
                        }

                        return {
                            label: tag,
                            kind: monaco.languages.CompletionItemKind.Snippet,
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            insertText: insertText,
                            documentation: `Auto-completes to <${tag}>...`,
                            range: range
                        };
                    });

                    return { suggestions: suggestions };
                }
            });

            // Create models for seamless tab switching
            models.html = monaco.editor.createModel(defaultCode.html, 'html');
            models.css = monaco.editor.createModel(defaultCode.css, 'css');
            models.js = monaco.editor.createModel(defaultCode.js, 'javascript');

            // Determine initial theme based on HTML class
            const isDark = document.documentElement.classList.contains('dark');

            // Initialize the editor
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                model: models.html,
                theme: isDark ? 'vs-dark' : 'vs',
                automaticLayout: true, // Automatically resizes on container change (crucial for mobile layout shifts)
                minimap: { enabled: false },
                fontSize: window.innerWidth < 768 ? 12 : 14, // Responsive font size
                fontFamily: "'Fira Code', 'JetBrains Mono', 'Consolas', monospace",
                wordWrap: 'on',
                formatOnPaste: true,
                suggestOnTriggerCharacters: true,
                autoClosingBrackets: 'always',
                autoClosingQuotes: 'always',
                autoIndent: 'full',
                padding: { top: 10 }
            });

            // Set up auto-update listeners for all models
            models.html.onDidChangeContent(() => schedulePreviewUpdate());
            models.css.onDidChangeContent(() => schedulePreviewUpdate());
            models.js.onDidChangeContent(() => schedulePreviewUpdate());

            // Initial preview on load
            schedulePreviewUpdate();
        });

        // Handle Tab Switching
        const tabButtons = document.querySelectorAll('.tab-btn');
        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tabButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentLang = btn.getAttribute('data-lang');
                
                if (editor && models[currentLang]) {
                    editor.setModel(models[currentLang]);
                }
            });
        });

        // Auto-update with Debounce and Validation
        function schedulePreviewUpdate() {
            clearTimeout(updateTimeout);
            updateTimeout = setTimeout(validateAndUpdatePreview, 500);
        }

        // Strict HTML Validation
        function validateHTML(model) {
            const content = model.getValue();
            const markers = [];
            
            // Find body tags
            const bodyStart = content.match(/<body[^>]*>/i);
            const bodyEnd = content.match(/<\/body>/i);
            
            if (!bodyStart || !bodyEnd) {
                markers.push({
                    severity: monaco.MarkerSeverity.Error,
                    message: "Strict Mode: Missing <body> or </body> tag.",
                    startLineNumber: 1,
                    startColumn: 1,
                    endLineNumber: model.getLineCount(),
                    endColumn: model.getLineMaxColumn(model.getLineCount())
                });
                return markers;
            }

            const bodyStartIndex = bodyStart.index;
            const bodyEndIndex = bodyEnd.index;

            // Allowed tags outside body (standard boilerplate elements)
            const allowedOutsideBody = ['html', 'head', 'title', 'meta', 'link', 'style', 'script', 'body', '!doctype'];
            
            // Regex to find all HTML tags in the document
            const tagRegex = /<\/?([a-z0-9\-]+)[^>]*>/gi;
            let match;
            
            while ((match = tagRegex.exec(content)) !== null) {
                const tagName = match[1].toLowerCase();
                const tagIndex = match.index;
                
                // If tag is located before <body> or after </body>
                if (tagIndex < bodyStartIndex || tagIndex > bodyEndIndex) {
                    if (!allowedOutsideBody.includes(tagName)) {
                        // Calculate exact line and column for the red squiggly line
                        const pos = model.getPositionAt(tagIndex);
                        const endPos = model.getPositionAt(tagIndex + match[0].length);
                        
                        markers.push({
                            severity: monaco.MarkerSeverity.Error,
                            message: `Syntax Error: Element <${tagName}> cannot be placed outside <body>...</body>`,
                            startLineNumber: pos.lineNumber,
                            startColumn: pos.column,
                            endLineNumber: endPos.lineNumber,
                            endColumn: endPos.column
                        });
                    }
                }
            }
            
            return markers;
        }

        // Validate and Update iframe securely
        function validateAndUpdatePreview() {
            if (!models.html || !models.css || !models.js) return;

            // Run validation on HTML model
            const markers = validateHTML(models.html);
            
            // Apply error markers (red squiggly lines) to Monaco editor
            monaco.editor.setModelMarkers(models.html, 'html-strict-validator', markers);
            
            // Halt preview update if there are any HTML format errors
            if (markers.length > 0) {
                return;
            }

            const htmlContent = models.html.getValue();
            const cssContent = models.css.getValue();
            const jsContent = models.js.getValue();

            const combinedSource = `
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <style>${cssContent}</style>
                </head>
                <body>
                    ${htmlContent}
                    <script>
                        try {
                            ${jsContent}
                        } catch(e) {
                            console.error("JavaScript Error: ", e);
                        }
                    <\/script>
                </body>
                </html>
            `;

            previewFrame.srcdoc = combinedSource;
        }
        
        // Reset Logic
        document.getElementById('btn-reset').addEventListener('click', () => {
            if(confirm("Are you sure you want to reset all code? Your changes will be lost.")) {
                models.html.setValue(defaultCode.html);
                models.css.setValue(defaultCode.css);
                models.js.setValue(defaultCode.js);
                updatePreview();
            }
        });

        // Download Logic
        document.getElementById('btn-download').addEventListener('click', () => {
            const htmlContent = models.html.getValue();
            const cssContent = models.css.getValue();
            const jsContent = models.js.getValue();

            const combinedSource = `<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>HTML Editor Pro Export</title>\n    <style>\n${cssContent}\n    </style>\n</head>\n<body>\n${htmlContent}\n    <script>\n${jsContent}\n    <\/script>\n</body>\n</html>`;

            const blob = new Blob([combinedSource], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Handle resize events to tweak font size based on mobile vs desktop
        window.addEventListener('resize', () => {
            if(editor) {
                const currentSize = window.innerWidth < 768 ? 12 : 14;
                editor.updateOptions({ fontSize: currentSize });
            }
        });

        // Image Upload & Insertion Logic
        const btnInsertImage = document.getElementById('btn-insert-image');
        const imageUpload = document.getElementById('image-upload');
        const insertImageText = btnInsertImage.querySelector('span');
        const insertImageIcon = btnInsertImage.querySelector('i');

        btnInsertImage.addEventListener('click', () => {
            imageUpload.click();
        });

        imageUpload.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            // Show loading state
            const originalText = insertImageText.innerText;
            const originalIconClass = insertImageIcon.className;
            
            insertImageIcon.className = 'fa-solid fa-spinner fa-spin';
            insertImageText.innerText = 'Processing...';
            btnInsertImage.disabled = true;

            try {
                // Generate a short, temporary Blob URL instead of a massive Base64 string
                const blobUrl = URL.createObjectURL(file);
                const imgTag = `<img src="${blobUrl}" alt="${file.name}">`;
                
                // If the user is not on the HTML tab, switch them to it automatically
                if (currentLang !== 'html') {
                    document.querySelector('.tab-btn[data-lang="html"]').click();
                }

                // Insert the tag at the current cursor position using Monaco API
                if (editor) {
                    const position = editor.getPosition();
                    editor.executeEdits('insert-image', [{
                        range: new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column),
                        text: imgTag,
                        forceMoveMarkers: true
                    }]);
                    editor.focus();
                }
            } catch (error) {
                alert("Error processing image.");
                console.error(error);
            } finally {
                // Reset UI state
                insertImageIcon.className = originalIconClass;
                insertImageText.innerText = originalText;
                btnInsertImage.disabled = false;
                
                // Clear the input so the same file can be selected again if needed
                imageUpload.value = '';
            }
        });

    </script>
</body>
</html>
