<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BUTEX Cover Page Generator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { butexBlue: '#1e3a8a' } } }
        }
    </script>

    <!-- Libraries for Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            /* whole app fits one screen, no page scroll */
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---------- Animated mesh background ---------- */
        .mesh-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            filter: blur(60px);
            animation: meshAnimation 20s ease-in-out infinite alternate;
            transition: all .5s ease;
        }

        .dark .mesh-bg {
            background-color: #0b1120;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(79, 70, 229, .40), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, .28), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(14, 165, 233, .38), transparent 50%);
        }

        html:not(.dark) .mesh-bg {
            background-color: #eef2f9;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(79, 70, 229, .20), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, .18), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(14, 165, 233, .20), transparent 50%);
        }

        @keyframes meshAnimation {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1) translate(2%, 2%);
            }

            100% {
                transform: scale(1) translate(-2%, -2%);
            }
        }

        /* ---------- Glass UI ---------- */
        .glass-panel {
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 1.1rem;
            transition: background .3s ease, border-color .3s ease;
        }

        .dark .glass-panel {
            background: rgba(30, 41, 59, .65);
            border: 1px solid rgba(255, 255, 255, .09);
            box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
        }

        html:not(.dark) .glass-panel {
            background: rgba(255, 255, 255, .72);
            border: 1px solid rgba(255, 255, 255, .6);
            box-shadow: 0 10px 40px rgba(31, 38, 135, .10);
        }

        .glass-input {
            width: 100%;
            font-size: 16px;
            /* prevents iOS zoom on focus */
            transition: all .25s ease;
        }

        .dark .glass-input {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .12);
            color: #fff;
        }

        .dark .glass-input::placeholder {
            color: rgba(203, 213, 225, .45);
        }

        .dark .glass-input:focus {
            background: rgba(255, 255, 255, .10);
            border-color: rgba(129, 140, 248, .7);
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .25);
        }

        html:not(.dark) .glass-input {
            background: rgba(255, 255, 255, .95);
            border: 1px solid rgba(15, 23, 42, .12);
            color: #1e293b;
        }

        html:not(.dark) .glass-input::placeholder {
            color: rgba(100, 116, 139, .6);
        }

        html:not(.dark) .glass-input:focus {
            background: #fff;
            border-color: rgba(99, 102, 241, .6);
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .18);
        }

        .dark select option {
            background-color: #1e293b;
            color: #fff;
        }

        html:not(.dark) select option {
            background-color: #fff;
            color: #1e293b;
        }

        .dark input[type="date"] {
            color-scheme: dark;
        }

        .tab-btn {
            transition: all .25s ease;
        }

        .tab-btn.active {
            background: linear-gradient(90deg, #4f46e5, #2563eb);
            color: #fff;
            box-shadow: 0 4px 14px rgba(79, 70, 229, .35);
        }

        /* ---------- Preview area ---------- */
        .preview-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 12px;
        }

        .scale-wrapper {
            position: relative;
            flex: none;
        }

        .page-container {
            background: #fff;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
            transform-origin: top left;
            position: absolute;
            top: 0;
            left: 0;
            color: #1a1a1a;
            overflow: hidden;
        }

        .size-a4 {
            width: 794px;
            height: 1123px;
        }

        .size-letter {
            width: 816px;
            height: 1056px;
        }

        /* ---------- Cover page design (print-safe) ---------- */
        .page-content {
            position: relative;
            height: 100%;
            padding: 56px 72px 52px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .page-frame {
            position: absolute;
            inset: 22px;
            border: 2px solid #1e3a8a;
            pointer-events: none;
        }

        .page-frame::after {
            content: "";
            position: absolute;
            inset: 6px;
            border: 1px solid #93a8dd;
        }

        .page-content>*:not(.page-frame) {
            position: relative;
            z-index: 1;
        }

        .logo-box {
            width: 150px;
            height: 150px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .logo-fallback {
            display: none;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #1e3a8a;
            align-items: center;
            justify-content: center;
            color: #1e3a8a;
            font-weight: 700;
            font-size: 26px;
            background: #eff6ff;
            letter-spacing: 2px;
        }

        .logo-box.no-logo img {
            display: none;
        }

        .logo-box.no-logo .logo-fallback {
            display: flex;
        }

        .uni-title {
            font-family: 'Playfair Display', serif;
            color: #1e3a8a;
            text-align: center;
            font-size: 40px;
            font-weight: 700;
            margin: 6px 0 0;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .uni-title .tl {
            display: block;
            width: 100%;
            text-align: center;
            padding-left: 1px;
            /* offsets trailing letter-spacing */
        }

        .title-rule {
            width: 120px;
            height: 4px;
            border-radius: 4px;
            margin: 20px auto 0;
            background: linear-gradient(90deg, #1e3a8a, #6366f1);
        }

        .assignment-block {
            text-align: center;
            margin: 72px 0 0;
            padding: 34px 28px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            background: #ffffff;
        }

        .assignment-label {
            margin: 0 0 12px;
            font-size: 16px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: .25em;
        }

        .assignment-name {
            margin: 0;
            font-size: 34px;
            font-weight: 700;
            color: #1e293b;
            line-height: 1.25;
            word-break: break-word;
            overflow-wrap: anywhere;
            min-height: 44px;
        }

        .assignment-no-row {
            text-align: center;
            margin-top: 44px;
        }

        .assignment-no-row p {
            margin: 0;
            font-size: 20px;
            color: #334155;
            font-weight: 500;
        }

        .assignment-no {
            display: inline-block;
            min-width: 70px;
            padding: 0 10px 4px;
            margin-left: 6px;
            border-bottom: 2px solid #0f172a;
            font-weight: 700;
            color: #0f172a;
            text-align: center;
            min-height: 30px;
            vertical-align: bottom;
        }

        .submission-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 270px;
            gap: 30px;
            margin-top: auto;
            margin-bottom: 36px;
            align-items: start;
        }

        .submission-col.right {
            text-align: left;
            padding-left: 0;
        }

        .submission-title {
            display: inline-block;
            margin: 0;
            padding-bottom: 5px;
            border-bottom: 2px solid #1e3a8a;
            font-weight: 700;
            font-size: 16px;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .teacher-text {
            margin-top: 14px;
            font-size: 19px;
            font-weight: 500;
            color: #334155;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            min-height: 28px;
        }

        .student-row {
            margin-top: 8px;
            font-size: 19px;
            font-weight: 500;
            line-height: 1.4;
            color: #475569;
            display: flex;
            justify-content: flex-start;
            gap: 8px;
            align-items: baseline;
            flex-wrap: nowrap;
        }

        .student-row.first {
            margin-top: 14px;
        }

        .student-row .lbl {
            color: #334155;
            font-weight: 700;
            white-space: nowrap;
        }

        .submission-col {
            min-width: 0;
        }

        .student-row .val {
            color: #1e293b;
            font-weight: 600;
            min-height: 26px;
            min-width: 0;
            flex: 1 1 auto;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .student-row .val.name {
            font-weight: 700;
        }

        .date-footer {
            text-align: left;
            padding-top: 22px;
            border-top: 1px solid #cbd5e1;
        }

        .date-footer p {
            margin: 0;
            font-size: 20px;
            color: #475569;
            font-weight: 500;
        }

        .date-footer .val {
            font-weight: 700;
            color: #1e293b;
            display: inline-block;
            min-width: 120px;
            min-height: 26px;
            vertical-align: bottom;
        }

        /* ---------- Mobile: normal scrolling page (form -> export -> preview) ---------- */
        @media (max-width: 1023px) {

            html,
            body {
                height: auto;
                min-height: 100%;
                overflow-x: hidden;
                overflow-y: auto;
            }

            .preview-wrapper {
                flex: none;
                align-items: flex-start;
                padding: 12px;
            }
        }

        /* ---------- Scrollbar (only used if a tiny screen needs it inside the form) ---------- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, .5);
            border-radius: 4px;
        }
    </style>
</head>

<body class="text-slate-800 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

    <div class="mesh-bg"></div>

    <!-- App shell: exactly one screen tall, never scrolls -->
    <main
        class="relative z-10 mx-auto w-full max-w-7xl min-h-[100dvh] lg:h-[100dvh] flex flex-col lg:flex-row gap-3 p-3 lg:p-4">

        <!-- ================= LEFT: FORM ================= -->
        <section id="panel-edit" class="w-full lg:w-[40%] flex-none lg:min-h-0 flex flex-col gap-3">

            <!-- Header -->
            <header class="shrink-0 glass-panel px-4 py-3 flex justify-between items-center gap-3">
                <div class="min-w-0">
                    <h1
                        class="text-lg sm:text-2xl font-bold leading-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-500 dark:from-blue-400 dark:to-emerald-400 truncate">
                        BUTEX Generator
                    </h1>
                    <p class="text-slate-500 dark:text-slate-400 text-[11px] sm:text-xs">Create pristine assignment
                        cover pages instantly.</p>
                </div>

                <button id="theme-toggle"
                    class="shrink-0 p-2.5 rounded-full bg-white/30 dark:bg-white/10 hover:bg-white/50 dark:hover:bg-white/20 transition-colors border border-slate-200 dark:border-white/10 shadow-sm"
                    aria-label="Toggle Theme">
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-yellow-400" fill="currentColor"
                        viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 4.22a1 1 0 011.415 0l.884.884a1 1 0 01-1.414 1.415l-.884-.884a1 1 0 010-1.415zM1 10a1 1 0 011-1h1a1 1 0 110 2H2a1 1 0 01-1-1zm15 0a1 1 0 011-1h1a1 1 0 110 2h-1a1 1 0 01-1-1zM5.636 15.757a1 1 0 010 1.414l-.884.884a1 1 0 01-1.414-1.414l.884-.884a1 1 0 011.414 0zM14.364 15.757a1 1 0 011.414 0l.884.884a1 1 0 11-1.414 1.414l-.884-.884a1 1 0 010-1.414zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM10 5a5 5 0 100 10 5 5 0 000-10z"
                            clip-rule="evenodd"></path>
                    </svg>
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 text-slate-700" fill="currentColor"
                        viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                </button>
            </header>

            <!-- Form (scrolls internally only on extremely short screens) -->
            <div class="glass-panel p-4 flex-none lg:flex-1 lg:min-h-0 lg:overflow-y-auto">
                <div class="space-y-3 sm:space-y-4">

                    <div>
                        <h2
                            class="text-[11px] font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-300 mb-2 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-indigo-500"></span> Assignment Info
                        </h2>
                        <div class="space-y-2.5">
                            <div>
                                <label for="inp-assignment-name"
                                    class="block text-[11px] font-medium text-slate-600 dark:text-slate-400 mb-1">Assignment
                                    Topic/Name</label>
                                <input type="text" id="inp-assignment-name" autocomplete="off"
                                    class="glass-input px-3 py-2.5 rounded-xl"
                                    placeholder="e.g. Modern Textile Wet Processing">
                            </div>
                            <div class="grid grid-cols-5 gap-2.5">
                                <div class="col-span-2">
                                    <label for="inp-assignment-no"
                                        class="block text-[11px] font-medium text-slate-600 dark:text-slate-400 mb-1">Assignment
                                        No.</label>
                                    <input type="text" id="inp-assignment-no" autocomplete="off"
                                        class="glass-input px-3 py-2.5 rounded-xl" placeholder="e.g. 01">
                                </div>
                                <div class="col-span-3">
                                    <label for="inp-date"
                                        class="block text-[11px] font-medium text-slate-600 dark:text-slate-400 mb-1">Date
                                        of Submission</label>
                                    <input type="date" id="inp-date" class="glass-input px-3 py-2.5 rounded-xl"
                                        style="min-height:44px">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2
                            class="text-[11px] font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-300 mb-2 flex items-center justify-between">
                            <span class="flex items-center gap-2"><span
                                    class="w-2 h-2 rounded-full bg-emerald-500"></span> Student Info</span>
                            <span
                                class="text-[10px] bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300 px-2 py-0.5 rounded-full normal-case">auto-saved</span>
                        </h2>
                        <div class="grid grid-cols-5 gap-2.5">
                            <div class="col-span-3">
                                <label for="inp-student-name"
                                    class="block text-[11px] font-medium text-slate-600 dark:text-slate-400 mb-1">Your
                                    Name</label>
                                <input type="text" id="inp-student-name" autocomplete="name"
                                    class="glass-input px-3 py-2.5 rounded-xl" placeholder="e.g. Rakib Hasan">
                            </div>
                            <div class="col-span-2">
                                <label for="inp-student-id"
                                    class="block text-[11px] font-medium text-slate-600 dark:text-slate-400 mb-1">Student
                                    ID</label>
                                <input type="text" id="inp-student-id" autocomplete="off"
                                    class="glass-input px-3 py-2.5 rounded-xl" placeholder="2020-1-1-XXX">
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2
                            class="text-[11px] font-bold uppercase tracking-wider text-pink-600 dark:text-pink-300 mb-2 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-pink-500"></span> Teacher Info
                        </h2>
                        <label for="inp-teacher-name"
                            class="block text-[11px] font-medium text-slate-600 dark:text-slate-400 mb-1">Teacher's Name
                            &amp; Designation</label>
                        <textarea id="inp-teacher-name" rows="2" class="glass-input px-3 py-2.5 rounded-xl resize-none"
                            placeholder="e.g. Dr. Jane Doe&#10;Professor, Dept. of Yarn Engineering"></textarea>
                    </div>
                </div>
            </div>

            <!-- Export -->
            <div class="shrink-0 glass-panel p-3 sm:p-4 border-t-[3px] border-t-indigo-500">
                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label for="sel-page-size"
                            class="block text-[11px] font-medium text-slate-600 dark:text-slate-400 mb-1">Size</label>
                        <select id="sel-page-size" class="glass-input px-3 py-2.5 rounded-xl cursor-pointer">
                            <option value="a4" selected>A4</option>
                            <option value="letter">Letter</option>
                        </select>
                    </div>
                    <div>
                        <label for="sel-format"
                            class="block text-[11px] font-medium text-slate-600 dark:text-slate-400 mb-1">Format</label>
                        <select id="sel-format" class="glass-input px-3 py-2.5 rounded-xl cursor-pointer">
                            <option value="pdf" selected>PDF</option>
                            <option value="png">PNG</option>
                            <option value="jpg">JPG</option>
                        </select>
                    </div>
                    <button id="btn-download"
                        class="col-span-2 w-full px-6 py-3 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-semibold rounded-xl shadow-lg hover:shadow-indigo-500/30 transition-all active:scale-[.98] disabled:opacity-50 flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span id="btn-label">Export Cover Page</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- ================= RIGHT: PREVIEW ================= -->
        <section id="panel-preview"
            class="flex w-full lg:w-[60%] flex-none lg:flex-1 lg:min-h-0 glass-panel flex-col overflow-hidden">
            <div
                class="shrink-0 px-4 py-2.5 border-b border-slate-200 dark:border-white/10 flex justify-between items-center bg-white/40 dark:bg-black/20 backdrop-blur-md">
                <span class="text-sm font-semibold flex items-center gap-2">
                    <span class="relative flex h-2.5 w-2.5">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    Live Preview
                </span>
                <div class="flex items-center gap-2">
                    <span id="size-badge"
                        class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300">A4</span>
                    <button id="btn-download-2"
                        class="lg:hidden text-[11px] font-semibold px-3 py-1 rounded-full bg-indigo-600 text-white active:scale-95">Export</button>
                </div>
            </div>

            <div class="preview-wrapper" id="preview-scroll-area">
                <div id="scale-wrapper" class="scale-wrapper">

                    <div id="preview-page" class="page-container size-a4">
                        <div class="page-content">
                            <div class="page-frame"></div>

                            <!-- Header -->
                            <div class="logo-box" id="logo-box">
                                <img src="img/butlogo.png" alt="BUTEX Logo" id="logo-img">
                                <div class="logo-fallback">BUTEX</div>
                            </div>
                            <h1 class="uni-title"><span class="tl">Bangladesh University</span><span class="tl">Of
                                    Textiles</span></h1>
                            <div class="title-rule"></div>

                            <!-- Topic -->
                            <div class="assignment-block">
                                <p class="assignment-label">Assignment On</p>
                                <h2 id="out-assignment-name" class="assignment-name"></h2>
                            </div>

                            <!-- Assignment Number -->
                            <div class="assignment-no-row">
                                <p>Assignment No: <span id="out-assignment-no" class="assignment-no"></span></p>
                            </div>

                            <!-- Submission Grid -->
                            <div class="submission-grid">
                                <div class="submission-col">
                                    <h3 class="submission-title">Submitted To</h3>
                                    <div id="out-teacher-name" class="teacher-text"></div>
                                </div>

                                <div class="submission-col right">
                                    <h3 class="submission-title">Submitted By</h3>
                                    <div class="student-row first">
                                        <span id="out-student-name" class="val name"></span>
                                    </div>
                                    <div class="student-row">
                                        <span class="lbl">ID:</span>
                                        <span id="out-student-id" class="val"></span>
                                    </div>
                                </div>
                            </div>

                            <!-- Date Footer -->
                            <div class="date-footer">
                                <p>Date of Submission: <span id="out-date" class="val"></span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // ---------- Elements ----------
            const inputs = {
                assignmentName: document.getElementById('inp-assignment-name'),
                assignmentNo: document.getElementById('inp-assignment-no'),
                date: document.getElementById('inp-date'),
                studentName: document.getElementById('inp-student-name'),
                studentId: document.getElementById('inp-student-id'),
                teacherName: document.getElementById('inp-teacher-name')
            };
            const outputs = {
                assignmentName: document.getElementById('out-assignment-name'),
                assignmentNo: document.getElementById('out-assignment-no'),
                date: document.getElementById('out-date'),
                studentName: document.getElementById('out-student-name'),
                studentId: document.getElementById('out-student-id'),
                teacherName: document.getElementById('out-teacher-name')
            };

            const pagePreview = document.getElementById('preview-page');
            const scaleWrapper = document.getElementById('scale-wrapper');
            const scrollArea = document.getElementById('preview-scroll-area');
            const pageSizeSelect = document.getElementById('sel-page-size');
            const sizeBadge = document.getElementById('size-badge');
            const logoBox = document.getElementById('logo-box');
            const logoImg = document.getElementById('logo-img');

            // Logo fallback if butlogo.png is missing
            logoImg.addEventListener('error', () => logoBox.classList.add('no-logo'));

            // ---------- Theme ----------
            const themeToggleBtn = document.getElementById('theme-toggle');
            const darkIcon = document.getElementById('theme-toggle-dark-icon');
            const lightIcon = document.getElementById('theme-toggle-light-icon');

            // Light is the default; dark only if the user chose it before
            if (localStorage.getItem('color-theme') === 'dark') {
                document.documentElement.classList.add('dark');
                lightIcon.classList.remove('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                darkIcon.classList.remove('hidden');
            }

            themeToggleBtn.addEventListener('click', () => {
                darkIcon.classList.toggle('hidden');
                lightIcon.classList.toggle('hidden');
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            });

            // ---------- Load cached student info ----------
            if (localStorage.getItem('butex_name')) inputs.studentName.value = localStorage.getItem('butex_name');
            if (localStorage.getItem('butex_id')) inputs.studentId.value = localStorage.getItem('butex_id');

            // ---------- Input -> Preview binding (empty stays empty) ----------
            function bindInput(inputEl, outputEl, isDate = false) {
                const update = () => {
                    let val = inputEl.value.trim();
                    if (isDate && val) {
                        const dateObj = new Date(val);
                        val = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
                    }
                    outputEl.textContent = val;
                };
                inputEl.addEventListener('input', update);
                update();
            }

            bindInput(inputs.assignmentName, outputs.assignmentName);
            bindInput(inputs.assignmentNo, outputs.assignmentNo);
            bindInput(inputs.date, outputs.date, true);
            bindInput(inputs.studentName, outputs.studentName);
            bindInput(inputs.studentId, outputs.studentId);
            bindInput(inputs.teacherName, outputs.teacherName);

            inputs.studentName.addEventListener('input', e => localStorage.setItem('butex_name', e.target.value));
            inputs.studentId.addEventListener('input', e => localStorage.setItem('butex_id', e.target.value));

            // ---------- Preview scaling: always fits the visible area (width AND height) ----------
            function updatePreviewScale() {
                const cs = getComputedStyle(scrollArea);
                const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
                const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);

                const isDesktop = window.matchMedia('(min-width: 1024px)').matches;
                const availableWidth = scrollArea.clientWidth - padX;
                // Desktop fits the page to the panel height; mobile fits width only and scrolls
                const availableHeight = isDesktop ? scrollArea.clientHeight - padY : Infinity;
                if (availableWidth <= 0 || availableHeight <= 0) return;

                const pageWidth = pagePreview.offsetWidth;
                const pageHeight = pagePreview.offsetHeight;

                let scale = Math.min(availableWidth / pageWidth, availableHeight / pageHeight, 1);
                scale = Math.max(0.1, scale);

                pagePreview.style.transform = `scale(${scale})`;
                scaleWrapper.style.width = `${pageWidth * scale}px`;
                scaleWrapper.style.height = `${pageHeight * scale}px`;
            }

            pageSizeSelect.addEventListener('change', (e) => {
                pagePreview.className = `page-container size-${e.target.value}`;
                sizeBadge.textContent = e.target.value === 'letter' ? 'Letter' : 'A4';
                setTimeout(updatePreviewScale, 10);
            });

            setTimeout(updatePreviewScale, 50);
            window.addEventListener('resize', updatePreviewScale);
            window.addEventListener('orientationchange', () => setTimeout(updatePreviewScale, 250));
            window.addEventListener('load', updatePreviewScale);
            if ('ResizeObserver' in window) new ResizeObserver(updatePreviewScale).observe(scrollArea);

            // ---------- Export ----------
            const downloadBtn = document.getElementById('btn-download');
            const downloadBtn2 = document.getElementById('btn-download-2');
            const btnLabel = document.getElementById('btn-label');
            const formatSelect = document.getElementById('sel-format');

            async function doExport() {
                downloadBtn.disabled = true;
                downloadBtn2.disabled = true;
                btnLabel.textContent = 'Rendering...';

                const currentScale = pagePreview.style.transform;
                try {
                    if (document.fonts && document.fonts.ready) await document.fonts.ready;

                    pagePreview.style.transform = 'scale(1)';

                    const canvas = await html2canvas(pagePreview, {
                        scale: 3,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        logging: false,
                        scrollX: 0,
                        scrollY: 0
                    });

                    const format = formatSelect.value;
                    const filename = `BUTEX_Assignment_${inputs.assignmentNo.value.trim() || 'Cover'}`;

                    if (format === 'pdf') {
                        const { jsPDF } = window.jspdf;
                        const pdfFormat = pageSizeSelect.value === 'letter' ? 'letter' : 'a4';
                        const pdf = new jsPDF({ orientation: 'portrait', unit: 'px', format: pdfFormat });
                        const imgData = canvas.toDataURL('image/jpeg', 0.95);
                        pdf.addImage(imgData, 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
                        pdf.save(`${filename}.pdf`);
                    } else {
                        const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
                        const link = document.createElement('a');
                        link.download = `${filename}.${format}`;
                        link.href = canvas.toDataURL(mimeType, 1.0);
                        link.click();
                    }
                } catch (err) {
                    console.error(err);
                    alert('Failed to export. Please try again.');
                } finally {
                    pagePreview.style.transform = currentScale;
                    downloadBtn.disabled = false;
                    downloadBtn2.disabled = false;
                    btnLabel.textContent = 'Export Cover Page';
                }
            }
            downloadBtn.addEventListener('click', doExport);
            downloadBtn2.addEventListener('click', doExport);

            // Prevent form submit on Enter in single-line inputs
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') e.preventDefault();
                });
            });
        });
    </script>
</body>

</html>
